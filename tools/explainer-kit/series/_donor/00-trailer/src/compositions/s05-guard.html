            <div class="gate" id="s05-g3" style="left:1225px;"><div class="glabel">{{ui:web.invoicing.title}}</div><svg viewBox="0 0 100 114"><path d="M50 6 L90 20 V56 C90 84 72 102 50 110 C28 102 10 84 10 56 V20 Z" fill="#0c1630" stroke="#fbbf24" stroke-width="4" stroke-linejoin="round"/><path d="M42 36l-5 40M60 36l-5 40M33 49h34M32 63h34" fill="none" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round"/></svg></div>

        <script type="application/json" id="s05-sfx">[
          {"cue":"guard","off":1.0,"type":"whoosh","gain":0.8},
          {"cue":"expired","off":-0.1,"type":"click","gain":0.9},
          {"cue":"expired","off":0.05,"type":"error","gain":0.8},
          {"cue":"cmr","off":-1.3,"type":"whoosh","gain":0.5},
          {"cue":"cmr","off":0.0,"type":"click","gain":0.9},
          {"cue":"cmr","off":0.15,"type":"error","gain":0.6},
          {"cue":"cmr","off":2.15,"type":"pop","gain":0.7},
          {"cue":"cmr","off":2.4,"type":"whoosh","gain":0.5},
          {"cue":"cmr","off":3.4,"type":"click","gain":0.9},
          {"cue":"cmr","off":3.55,"type":"stamp","gain":1},
          {"cue":"cmr","off":4.1,"type":"type","gain":0.6},

      <script>
        const T = {{T}};
        const tl = gsap.timeline({ paused: true });
        const $ = (s) => document.querySelector("#s05-root " + s);
        const cam = $("#s05-cam"), world = $("#s05-world");
        const cur = $("#s05-cursor"), rip = $("#s05-ripple");

        // world-space position of an element (layout offsets, camera/transform independent)
        function pos(el) {
          let x = 0, y = 0, e = el;
          while (e && e !== world) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; }
          return { x, y, w: el.offsetWidth, h: el.offsetHeight };
        }
        // cursor top-left so that the arrow tip (6,4) rests at the button's lower-right corner (labels stay readable)
        function tipAt(btn) {
          const p = pos(btn);
          return { x: p.x + p.w - 34, y: p.y + p.h - 20 };
        }
        // glue a dash to the word that follows it, so it never dangles at a line end
        function glueDashes(el) {
          // sentences become their own lines (balanced, no dangling dash); a dash sticks to the next word
          const sentences = el.textContent.trim().split(/(?<=[.!?])\s+/);
          el.textContent = "";
          sentences.forEach((sent) => {
            const line = document.createElement("span");
            line.style.display = "block";
            const words = sent.split(/\s+/);
            for (let i = 0; i < words.length; i++) {
              let w = words[i];
              if (/^[\u2014\u2013-]$/.test(w) && i + 1 < words.length) { w += " " + words[++i]; }
              const sp = document.createElement("span");
              sp.className = "w"; sp.textContent = w;
              if (line.childNodes.length) line.appendChild(document.createTextNode(" "));
              line.appendChild(sp);
            }
            el.appendChild(line);
          });
        }
        glueDashes($("#s05-t2 .k-title-text"));

        // key moments (scene-local), all derived from T
        const dive = T.guard + 1.0;                  // gates -> mission card
        const clickA = T.expired - 0.1;
        const toB = T.cmr - 1.3;                     // camera A -> B (arrives cmr - 0.2)
        const clickB = T.cmr;
        const toC = T.cmr + 2.4;                     // camera B -> C, after the refusal had its 1.5 s
        const tn = T.cmr + 3.4;                      // click on "Issue" (number cue +-0.3 s in every language)

        tl.set(rip, { opacity: 0, x: -300, y: -300 }, 0);
        K.camIn(tl, cam, 0);

        // ── Intro: three labelled gates on the thread ─────────────
        const g = ["#s05-g1", "#s05-g2", "#s05-g3"].map($);
        g.forEach((el, i) => K.pop(tl, el, T.guard - 0.75 + i * 0.28, { from: 0.75, d: 0.55 }));
        tl.fromTo($("#s05-thread"), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.9, ease: "power2.inOut" }, T.guard - 0.55);

        // dive into gate A: gates grow and dissolve, the mission card arrives
        tl.to(g, { scale: 2.3, opacity: 0, filter: "blur(8px)", duration: 0.8, ease: K.IN, stagger: 0.04 }, dive);
        tl.to($("#s05-thread"), { opacity: 0, duration: 0.5, ease: K.IN }, dive);
        tl.fromTo($("#s05-cardA"), { opacity: 0, scale: 0.9, y: 36, filter: "blur(8px)" },
          { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.95, ease: K.OUT }, dive + 0.2);
        // rows settle one by one so the card is alive while the narrator frames it
        tl.fromTo(document.querySelectorAll("#s05-root #s05-cardA .fld"), { opacity: 0.0, y: 22 },
          { opacity: 1, y: 0, duration: 0.6, ease: K.OUT, stagger: 0.18 }, dive + 0.85);
        tl.fromTo(document.querySelector("#s05-root #s05-cardA .foot"), { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.6, ease: K.OUT }, dive + 1.2);

        // ── Station A: refusal on the expired licence ─────────────
        const planBtn = $("#s05-planBtn");
        const a = tipAt(planBtn);
        tl.set(cur, { x: a.x + 300, y: a.y + 260 }, 0);
        const curA = Math.max(dive + 1.5, clickA - 1.5);
        tl.fromTo(cur, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, curA);
        K.cursorTo(tl, cur, a.x, a.y, curA + 0.05, clickA - curA - 0.15);
        K.click(tl, cur, planBtn, clickA, rip, a.x + 6, a.y + 4);
        const gateMsg = $("#s05-gate");
        tl.fromTo(gateMsg, { opacity: 0, y: -26 }, { opacity: 1, y: 0, duration: 0.5, ease: K.OUT }, clickA + 0.1);
        tl.fromTo($("#s05-tint"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: K.OUT }, clickA + 0.1);
        tl.fromTo($("#s05-edge"), { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: K.OUT }, clickA + 0.1);
        K.pop(tl, $("#s05-warn"), clickA + 0.2, { from: 0.6, d: 0.45 });
        K.fadeOut(tl, cur, clickA + 0.7, 0.35);
        const t1 = Math.min(T.expired + 0.45, toB - 2.2 - 1.3);
        K.title(tl, $("#s05-t1"), t1);

        // ── Camera A to B ─────────────────────────────────────────
        K.titleOut(tl, $("#s05-t1"), toB);
        tl.fromTo(world, { x: 0 }, { x: -1920, duration: 1.1, ease: K.MOVE }, toB);
        tl.fromTo($("#s05-cardB"), { rotationY: -9, rotationX: 3, transformPerspective: 1600 },
          { rotationY: 0, rotationX: 0, duration: 1.2, ease: K.OUT }, toB);

        // ── Station B: no signed CMR, no invoice ──────────────────
        const issueB = $("#s05-issueB");
        const b = tipAt(issueB);
        tl.set(cur, { x: b.x + 280, y: b.y + 220 }, toB);
        tl.fromTo(cur, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, toB + 0.45);
        K.cursorTo(tl, cur, b.x, b.y, toB + 0.5, 0.8);
        K.click(tl, cur, issueB, clickB, rip, b.x + 6, b.y + 4);
        const errCmr = $("#s05-errCmr");
        tl.fromTo(errCmr, { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.45, ease: K.OUT }, clickB + 0.15);
        K.fadeOut(tl, cur, clickB + 0.65, 0.35);
        // the paper arrives: badge flips, refusal fades (refusal fully readable >= 1.5 s first)
        const pend = $("#s05-cmrPend"), ok = $("#s05-cmrOk");
        tl.fromTo(pend, { rotationX: 0, opacity: 1 }, { rotationX: -90, opacity: 0, duration: 0.25, ease: K.IN }, T.cmr + 2.0);
        tl.fromTo(ok, { rotationX: 90, opacity: 0 }, { rotationX: 0, opacity: 1, duration: 0.45, ease: K.OUT }, T.cmr + 2.15);
        K.fadeOut(tl, errCmr, T.cmr + 2.1, 0.3);

        // ── Camera B to C ─────────────────────────────────────────
        tl.fromTo(world, { x: -1920 }, { x: -3840, duration: 0.95, ease: K.MOVE, immediateRender: false }, toC);
        tl.fromTo($("#s05-cardC"), { rotationY: -9, rotationX: 3, transformPerspective: 1600 },
          { rotationY: 0, rotationX: 0, duration: 1.05, ease: K.OUT }, toC);

        // title 2 must be readable >= 2.2 s before the exit (tightest in es / ru)
        K.title(tl, $("#s05-t2"), Math.min(tn + 0.3, T.out - 3.6));

        // ── Station C: issue, number, lock ────────────────────────
        const issueC = $("#s05-issueC");
        const c = tipAt(issueC);
        tl.set(cur, { x: c.x + 280, y: c.y + 220 }, toC);
        tl.fromTo(cur, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, toC + 0.2);
        K.cursorTo(tl, cur, c.x, c.y, toC + 0.3, 0.65);
        K.click(tl, cur, issueC, tn, rip, c.x + 6, c.y + 4);
        K.fadeOut(tl, cur, tn + 0.6, 0.35);
        tl.to(issueC, { opacity: 0.4, duration: 0.3, ease: "power2.out" }, tn + 0.3);   // issued: no longer actionable

        tl.to($("#s05-dash"), { opacity: 0, y: 14, duration: 0.25, ease: K.IN }, tn + 0.02);
        tl.fromTo($("#s05-num"), { opacity: 0, y: -52 }, { opacity: 1, y: 0, duration: 0.55, ease: K.OUT }, tn + 0.1);
        // the lock snaps shut: shackle drops, body presses
        tl.fromTo($("#s05-lock"), { scale: 1.45, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: K.OUT }, tn + 0.15);
        tl.fromTo($("#s05-shackle"), { y: -9 }, { y: 0, duration: 0.22, ease: "power3.in" }, tn + 0.17);
        K.swap(tl, $("#s05-pillDraft"), $("#s05-pillIssued"), tn + 0.2);
        // notes: the old one is gone before the new one rises (no overlap)
        tl.to($("#s05-noteDraft"), { opacity: 0, duration: 0.18, ease: "none" }, tn + 0.2);
        tl.fromTo($("#s05-noteLocked"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: K.OUT }, tn + 0.4);

        // the sequence strip: contiguous numbers slide in from the left
        const cells = document.querySelectorAll("#s05-root .cell");
        tl.fromTo(cells, { opacity: 0, x: -110 }, { opacity: 1, x: 0, duration: 0.5, ease: K.OUT, stagger: 0.09 }, tn + 0.7);

        // a mistake never edits: a new line under the issued number, the card above stays
        tl.fromTo($("#s05-wire"), { scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: K.OUT }, tn + 1.05);
        tl.fromTo($("#s05-creditIn"), { opacity: 0, y: -26 }, { opacity: 1, y: 0, duration: 0.5, ease: K.OUT }, tn + 1.15);

        K.camOut(tl, cam, T.out);
        window.__timelines["s05"] = tl;
      </script>
    </template>
  </body>
</html>
