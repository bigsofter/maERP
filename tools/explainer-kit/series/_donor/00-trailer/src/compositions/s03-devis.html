<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s03-root { position: absolute; inset: 0; overflow: hidden; }
        #s03-root .cam { position: absolute; inset: 0; }
        #s03-root .world { position: absolute; left: 0; top: 0; width: 3000px; height: 1080px; }

        /* scene-local legibility sizes (kit classes stay untouched) */
        #s03-root .k-chip { font-size: 20px; height: 44px; padding: 0 14px; }
        #s03-root .th { font-size: 20px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ui-ink-3); }

        /* ── DEVIS card (left station) ── */
        #s03-quote { position: absolute; left: 360px; top: 70px; width: 1200px; height: 720px; display: flex; flex-direction: column; }
        #s03-hdr { height: 100px; flex: none; padding: 0 32px; box-sizing: border-box; }
        #s03-ref { font-size: 34px; font-weight: 700; color: var(--ui-ink); }
        #s03-pw { position: relative; display: grid; }
        #s03-pw > .k-pill { grid-area: 1 / 1; justify-self: start; }
        #s03-ring { position: absolute; inset: -5px; border-radius: 999px; border: 3px solid var(--ok); opacity: 0; }
        #s03-lock { width: 44px; height: 44px; flex: none; opacity: 0; }
        #s03-right { margin-left: auto; text-align: right; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
        #s03-client { font-size: 26px; font-weight: 700; color: var(--ui-ink); }
        #s03-lane { font-size: 20px; color: var(--ui-ink-3); white-space: nowrap; }

        #s03-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        #s03-btns { display: grid; justify-items: end; }
        #s03-btns > .k-btn { grid-area: 1 / 1; }
        #s03-mtitle { font-size: 24px; color: #475569; white-space: nowrap; }
        #s03-body .grid { display: grid; grid-template-columns: 380px 130px 160px 180px 282px; align-items: center; }

        #s03-body .unit { font-size: 24px; color: var(--ui-ink-3); white-space: nowrap; }
        #s03-body .price { text-align: right; font-size: 30px; font-weight: 600; color: var(--ui-ink); }
        #s03-body .src { display: flex; align-items: center; gap: 12px; padding-left: 16px; }
        #s03-root .callout-i { position: relative; margin: 0; width: 40px; height: 40px; font-size: 22px; flex: none; }
        #s03-band { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 28px; }
        #s03-note { max-width: 560px; font-size: 21px; padding: 18px 22px; }
        #s03-note svg { width: 28px; height: 28px; }
        #s03-tot { display: grid; grid-template-columns: auto auto; column-gap: 28px; row-gap: 4px; align-items: baseline; justify-content: end; }
        #s03-tot .tl { font-size: 26px; color: var(--ui-ink-3); text-align: right; }
        #s03-tot .tv { text-align: right; font-size: 46px; color: var(--ui-ink); white-space: nowrap; }
        #s03-tot .tv.s { font-size: 34px; }
        #s03-tot .tv small { font-size: 22px; color: var(--ui-ink-3); font-weight: 600; margin-left: 8px; }
        #s03-tot .ex { grid-column: 1 / 3; text-align: right; font-size: 21px; color: var(--ui-ink-3); }

        /* ── MISSION card (right station) ── */
        #s03-mission { position: absolute; left: 2040px; top: 120px; width: 1240px; display: flex; flex-direction: column; padding-bottom: 34px; }
        #s03-mhdr { height: 128px; flex: none; padding: 0 52px; box-sizing: border-box; }
        #s03-mttl { font-family: var(--f-display); font-size: 38px; font-weight: 600; letter-spacing: -0.02em; color: var(--ui-ink); }
        #s03-msub { font-size: 27px; color: var(--ui-ink-3); margin-top: 4px; }
        #s03-mfrom { margin-left: auto; }
        #s03-mbody { padding: 30px 52px 0; }
        #s03-mbody .mgrid { display: grid; grid-template-columns: 380px 130px 330px 292px; align-items: center; }
        #s03-mthead { height: 44px; }
        #s03-mthead .r { text-align: right; }
        #s03-mbody .slot { height: 92px; border-bottom: 2px solid var(--ui-bg2); }
        #s03-mtotal { display: flex; align-items: center; height: 124px; margin-top: 10px; border-top: 2px solid var(--ui-line); }
        #s03-mtl { font-family: var(--f-display); font-size: 32px; font-weight: 600; color: var(--ui-ink); flex: 1; padding-right: 20px; }
        #s03-eq { display: inline-flex; align-items: center; gap: 8px; height: 56px; padding: 0 18px; margin-right: 26px; border-radius: 999px; background: var(--ok-bg); color: var(--ok-fg); border: 2px solid var(--ok-line); font-family: var(--f-mono); font-weight: 700; font-size: 38px; }
        #s03-eq svg { width: 32px; height: 32px; }
        #s03-amtwrap { position: relative; display: block; font-family: var(--f-mono); font-weight: 700; font-size: 64px; color: var(--ui-ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
        #s03-amt { display: block; }
        #s03-ghost { position: absolute; left: 0; top: 0; display: block; color: var(--brand-500); text-shadow: 0 0 24px rgba(59, 130, 246, 0.55); opacity: 0; }
        #s03-cur-mad { font-family: var(--f-mono); font-weight: 600; font-size: 30px; color: var(--ui-ink-3); margin-left: 14px; }

        /* flying row clones */
        #s03-root .clone { position: absolute; width: 1132px; height: 92px; display: grid; grid-template-columns: 380px 130px 330px 292px; align-items: center; opacity: 0; z-index: 20; }
        #s03-root .clone .plate { position: absolute; left: -20px; right: -20px; top: 0; bottom: 0; background: #fff; border: 2px solid var(--ui-line); border-radius: 18px; box-shadow: 0 28px 50px -18px rgba(2, 6, 23, 0.45); }
        #s03-root .clone > *:not(.plate) { position: relative; }
        #s03-root .clone .c4 { padding-left: 20px; }

        /* cursor + ripple */
        #s03-cur { opacity: 0; }
        #s03-rip1, #s03-rip2 { opacity: 0; left: 0; top: 0; }
      </style>

      <div id="s03-root" data-composition-id="s03" data-width="1920" data-height="1080">
        <div class="cam">
          <div class="world" id="s03-world">

            <!-- DEVIS -->
            <div class="k-card" id="s03-quote">
              <div class="k-card-h dm" id="s03-hdr">
                <div id="s03-ref" class="k-mono">{{copy:demo.quote_ref}}</div>
                <div id="s03-pw">
                  <span class="k-pill is-blue" id="s03-p-sent"><span class="k-dot"></span>{{ui:web.quotes.st_sent}}</span>
                  <span class="k-pill is-green" id="s03-p-acc"><span class="k-dot"></span>{{ui:web.quotes.st_accepted}}</span>
                  <span id="s03-ring"></span>
                </div>
                <svg id="s03-lock" viewBox="0 0 44 44" fill="none">
                  <g id="s03-shackle"><path d="M14 20 V14 a8 8 0 0 1 16 0 V20" stroke="#FBBF24" stroke-width="4.5" stroke-linecap="round" fill="none"/></g>
                  <rect x="9" y="20" width="26" height="19" rx="5" fill="#FBBF24"/>
                  <circle cx="22" cy="29" r="2.8" fill="#7c4a03"/>
                </svg>
                <div id="s03-right">
                  <div id="s03-client">{{copy:demo.client}}</div>
                  <div id="s03-lane" class="k-mono">{{copy:demo.lane}}</div>
                </div>
              </div>

              <div id="s03-body">
                <div id="s03-secrow" class="dm">
                  <div id="s03-seclabel">{{ui:web.quotes.sec_lines}}</div>
                  <div id="s03-actions">
                    <div id="s03-btns">
                      <span class="k-btn is-ghost" id="s03-b-acc">{{ui:web.quotes.act_accept}}</span>
                      <span class="k-btn" id="s03-b-new">{{ui:web.quotes.act_create_mission}}</span>
                      <span class="k-btn" id="s03-b-open">{{ui:web.quotes.act_open_mission}}</span>
                    </div>
                    <div id="s03-mtitle" class="k-mono">{{copy:demo.mission_title_quote}}</div>

                <div id="s03-thead" class="grid th dm" data-layout-allow-overlap>
                  <div>{{ui:web.quotes.l_label}}</div><div>{{ui:web.quotes.l_qty}}</div><div>{{ui:web.quotes.l_unit}}</div><div class="r">{{ui:web.quotes.l_price}}</div><div></div>
                </div>
                <div class="k-row grid" id="s03-r1" data-layout-allow-overlap>
                  <div class="lbl dm">{{copy:demo.line1}}</div><div class="qty dm">1</div><div class="unit dm">{{ui:web.quotes.unit_forfait}}</div><div class="price k-mono dm">{{copy:demo.amt1}}</div>
                  <div class="src"><span class="k-chip" id="s03-c1">{{ui:web.quotes.src_tariff_client}}</span><span class="k-callout callout-i" id="s03-k1">1</span></div>
                </div>
                <div class="k-row grid" id="s03-r2" data-layout-allow-overlap>
                  <div class="lbl dm">{{copy:demo.line2}}</div><div class="qty dm">1</div><div class="unit dm">{{ui:web.quotes.unit_forfait}}</div><div class="price k-mono dm">{{copy:demo.amt2}}</div>
                  <div class="src"><span class="k-chip is-slate" id="s03-c2">{{ui:web.quotes.src_template}}</span><span class="k-callout callout-i" id="s03-k2">2</span></div>
                </div>

                <div id="s03-band">
                  <div class="k-alert is-amber" id="s03-note">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11 V8 a4 4 0 0 1 8 0 V11"/></svg>
                    <span>{{ui:web.quotes.note_accepted}}</span>
                  </div>
                  <div id="s03-tot">
                    <div class="tl">{{ui:web.quotes.total_ht}}</div><div class="tv k-num" id="s03-ht">0,00</div>
                    <div class="ex">{{ui:web.quotes.exempt}}</div>
                    <div class="tl">{{ui:web.quotes.total_ttc}}</div><div class="tv s k-num"><span id="s03-ttc">0,00</span><small>{{copy:demo.currency}}</small></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- MISSION -->
            <div class="k-card" id="s03-mission">
              <div class="k-card-h" id="s03-mhdr">
                <div>
                  <div id="s03-mttl">8. {{ui:web.missions.sec_economy_title}}</div>
                  <div id="s03-msub">{{ui:web.missions.sale_title}}</div>
                </div>
                <span class="k-chip" id="s03-mfrom">{{copy:demo.from_quote}}</span>
              </div>
              <div id="s03-mbody">
                <div id="s03-mthead" class="mgrid th" data-layout-allow-overlap>
                  <div>{{ui:web.missions.sale_col_service}}</div><div>{{ui:web.missions.sale_col_qty}}</div><div class="r">{{ui:web.missions.sale_col_amount}}</div><div></div>
                </div>
                <div class="slot" id="s03-slot1"></div>
                <div class="slot" id="s03-slot2"></div>
                <div id="s03-mtotal">
                  <div id="s03-mtl">{{ui:web.missions.sale_total}}</div>
                  <div id="s03-eq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 L10 17.5 L19 7"/></svg>=</div>
                  <div id="s03-amtwrap"><span id="s03-amt">{{copy:demo.total}}</span><span id="s03-ghost" data-layout-allow-overlap>{{copy:demo.total}}</span></div>
                  <span id="s03-cur-mad">{{copy:demo.currency}}</span>
                </div>
              </div>
            </div>

            <!-- flying copies of the two accepted lines -->
            <div class="clone" id="s03-cl1" data-layout-allow-overlap><div class="plate"></div>
              <div class="lbl c1" style="font-size:29px;font-weight:600;color:var(--ui-ink)">{{copy:demo.line1}}</div>
              <div class="qty c2" style="font-family:var(--f-mono);font-size:26px;color:var(--ui-ink-2)">1</div>
              <div class="c3 k-mono" style="text-align:right;font-size:30px;font-weight:600;color:var(--ui-ink)">{{copy:demo.amt1}}</div>
              <div class="c4"><span class="k-chip is-green">{{ui:web.missions.sale_source_quote}}</span></div>
            </div>
            <div class="clone" id="s03-cl2" data-layout-allow-overlap><div class="plate"></div>
              <div class="lbl c1" style="font-size:29px;font-weight:600;color:var(--ui-ink)">{{copy:demo.line2}}</div>
              <div class="qty c2" style="font-family:var(--f-mono);font-size:26px;color:var(--ui-ink-2)">1</div>
              <div class="c3 k-mono" style="text-align:right;font-size:30px;font-weight:600;color:var(--ui-ink)">{{copy:demo.amt2}}</div>
              <div class="c4"><span class="k-chip is-green">{{ui:web.missions.sale_source_quote}}</span></div>
            </div>

            <!-- cursor -->
            <div class="k-ripple" id="s03-rip1"></div>
            <div class="k-ripple" id="s03-rip2"></div>
            <svg class="k-cursor" id="s03-cur" viewBox="0 0 46 46"><path d="M5 3 L5 34 L13 27 L19 40 L25 37.5 L19 25 L30 25 Z" fill="#fff" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round"/></svg>
          </div>

          <div class="k-title" id="s03-title"><div class="k-title-bar"></div><div class="k-title-text">{{copy:s03.title}}</div></div>
        </div>
      </div>

      <script type="application/json" id="s03-sfx">[
        {"cue":"in","off":0.05,"type":"whoosh","gain":0.6},
        {"cue":"quote","off":-0.1,"type":"type","gain":0.4},
        {"cue":"quote","off":0.25,"type":"type","gain":0.4},
        {"cue":"source","off":0,"type":"pop","gain":0.6},
        {"cue":"source","off":0.35,"type":"pop","gain":0.6},
        {"cue":"accept","off":-0.1,"type":"click","gain":0.8},
        {"cue":"accept","off":0,"type":"stamp","gain":0.8},
        {"cue":"click","off":0,"type":"click","gain":0.8},
        {"cue":"lines","off":-0.3,"type":"whoosh","gain":0.8},
        {"cue":"lines","off":1.1,"type":"pop","gain":0.6},
        {"cue":"lines","off":1.3,"type":"pop","gain":0.6},
        {"cue":"lines","off":1.9,"type":"stamp","gain":0.6}
      ]</script>

      <script>
        const T = {{T}};
        const R = "#s03-root ";
        const $ = (s) => document.querySelector(R + s);
        const $$ = (s) => Array.from(document.querySelectorAll(R + s));
        const tl = gsap.timeline({ paused: true });
        const OUT = K.OUT, MOVE = K.MOVE, IN = K.IN;

        const world = $("#s03-world"), cam = $(".cam");
        const q = $("#s03-quote"), m = $("#s03-mission");

        // layout positions in world coordinates (offset chain, transform-free)
        function pos(el) {
          let x = 0, y = 0, e = el;
          while (e && e !== world) {
            x += e.offsetLeft; y += e.offsetTop;
            const p = e.offsetParent;
            if (p && p !== world) { x += p.clientLeft; y += p.clientTop; }
            e = p;
          }
          return { x, y, w: el.offsetWidth, h: el.offsetHeight };
        }
        const cx = (el) => { const p = pos(el); return p.x + p.w / 2; };
        const cy = (el) => { const p = pos(el); return p.y + p.h / 2; };

        gsap.set(world, { transformOrigin: "1500px 540px" });

        // ── 0. entrance ─────────────────────────────────────────
        K.camIn(tl, cam, 0);
        const cardAt = Math.min(0.15, Math.max(0, T.quote - 0.9));
        tl.fromTo(q, { opacity: 0, y: 60, rotationX: 5, rotationY: -6, transformPerspective: 1600 },
          { opacity: 1, y: 0, rotationX: 0, rotationY: 0, duration: 0.95, ease: OUT }, cardAt);
        tl.fromTo(m, { opacity: 0, rotationY: -9, transformPerspective: 1600 },
          { opacity: 1, rotationY: 0, duration: 1.2, ease: OUT }, T.lines - 0.1);

        // initial hidden states (fromTo keeps them seek-safe)
        const hide = (sel) => tl.fromTo($(sel), { opacity: 0 }, { opacity: 0, duration: 0.001 }, 0);
        ["#s03-p-acc", "#s03-b-new", "#s03-b-open", "#s03-mtitle", "#s03-note", "#s03-eq", "#s03-mfrom"].forEach(hide);
        tl.fromTo($("#s03-b-acc"), { opacity: 0 }, { opacity: 0, duration: 0.001 }, 0);

        // ── 1/2. rows, totals, count-up on the voice ───────────
        const rows = [$("#s03-r1"), $("#s03-r2")];
        const tr = Math.max(T.quote - 0.15, cardAt + 0.5);
        K.rise(tl, rows, tr, { y: 26, d: 0.6, stagger: 0.35 });
        const tot = $("#s03-tot");
        tl.fromTo(tot, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: OUT }, tr + 0.2);
        // HT and TTC count together (always the same value on screen)
        K.count(tl, $("#s03-ht"), 0, 30000, tr + 0.2, 1.3);
        K.count(tl, $("#s03-ttc"), 0, 30000, tr + 0.2, 1.3);

        // ── 3. source chips + callouts, focus dim ──────────────
        const chips = [$("#s03-c1"), $("#s03-c2")];
        const calls = [$("#s03-k1"), $("#s03-k2")];
        const ts = T.source - 0.15;
        chips.forEach((c, i) => K.pop(tl, c, ts + i * 0.35, { d: 0.5 }));
        calls.forEach((c, i) => K.pop(tl, c, ts + i * 0.35 + 0.3, { from: 0.5, d: 0.5 }));
        const dm = $$(".dm").concat(Array.from(tot.children));
        const dimAt = ts + 0.75;
        const restoreAt = Math.max(dimAt + 1.0, Math.min(T.source + 1.7, T.accept - 1.15));
        tl.fromTo(dm, { opacity: 1, filter: "blur(0px)" }, { opacity: 0.5, filter: "blur(2px)", duration: 0.5, ease: "power2.out" }, dimAt);
        tl.to(dm, { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power2.inOut" }, restoreAt);

        // ── 4. accept ─────────────────────────────────────────
        const bAcc = $("#s03-b-acc"), bNew = $("#s03-b-new"), bOpen = $("#s03-b-open");
        const cur = $("#s03-cur"), rip1 = $("#s03-rip1"), rip2 = $("#s03-rip2");
        K.pop(tl, bAcc, T.accept - 1.0, { from: 0.85, d: 0.5 });

        const pa = pos(bAcc);
        const accX = pa.x + pa.w * 0.72 - 5, accY = pa.y + pa.h * 0.92 - 3;
        tl.set(cur, { x: 2000, y: 1130 }, 0);
        tl.fromTo(cur, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, T.accept - 1.0);
        K.cursorTo(tl, cur, accX, accY, T.accept - 0.95, 0.85);

        const ripple = (rip, at, x, y) => {
          tl.set(rip, { x, y }, at);
          tl.fromTo(rip, { opacity: 0, scale: 0.25 }, { opacity: 0.95, scale: 0.55, duration: 0.07, ease: "none" }, at);
          tl.to(rip, { opacity: 0, scale: 1.7, duration: 0.6, ease: "power2.out" }, at + 0.07);
        };
        K.click(tl, cur, bAcc, T.accept - 0.1);
        ripple(rip1, T.accept - 0.1, accX + 4, accY + 3);

        // status swap + stamp ring + lock snap
        const pSent = $("#s03-p-sent"), pAcc = $("#s03-p-acc");
        K.swap(tl, pSent, pAcc, T.accept + 0.05, 0.45);
        const ring = $("#s03-ring");
        tl.fromTo(ring, { opacity: 0, scale: 0.92 }, { opacity: 0.9, scale: 1, duration: 0.1, ease: "none" }, T.accept + 0.2);
        tl.to(ring, { opacity: 0, scale: 1.28, duration: 0.6, ease: "power2.out" }, T.accept + 0.3);
        const lock = $("#s03-lock"), shackle = $("#s03-shackle");
        tl.fromTo(lock, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: OUT }, T.accept + 0.3);
        tl.fromTo(shackle, { y: -8 }, { y: 0, duration: 0.22, ease: "power3.in" }, T.accept + 0.5);
        K.pop(tl, $("#s03-note"), T.accept + 0.45, { from: 0.9, d: 0.6 });
        const quick = (o, n, at) => {
          tl.to(o, { opacity: 0, duration: 0.1, ease: "none" }, at);
          tl.fromTo(n, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.2, ease: OUT }, at + 0.06);
        };
        // accept button hands over to the primary one
        quick(bAcc, bNew, T.accept + 0.45);

        // ── 5. create the mission ─────────────────────────────
        const pn = pos(bNew);
        const newX = pn.x + pn.w * 0.72 - 5, newY = pn.y + pn.h * 0.92 - 3;
        K.cursorTo(tl, cur, newX, newY, T.click - 0.8, 0.65);
        K.click(tl, cur, bNew, T.click);
        ripple(rip2, T.click, newX + 4, newY + 3);
        quick(bNew, bOpen, T.click + 0.4);
        K.rise(tl, $("#s03-mtitle"), T.click + 0.6, { y: 14, d: 0.5 });
        tl.to(cur, { opacity: 0, duration: 0.3, ease: IN }, T.click + 0.7);

        // ── 6. camera travels right; the two accepted lines are carried along ──
        // Each clone moves in world x by exactly the camera shift, so on screen it hovers where
        // its row was while the devis slides away and the mission slides in; it lands on its slot
        // exactly when the camera stops. No flight over the destination header.
        const slots = [$("#s03-slot1"), $("#s03-slot2")];
        const clones = [$("#s03-cl1"), $("#s03-cl2")];
        const origs = rows;
        const trav = Math.max(T.lines - 0.3, T.click + 0.85);
        const CAMD = 1.4, SHIFT = 1700;
        clones.forEach((c, i) => {
          const from = pos(rows[i]), to = pos(slots[i]);
          c.style.left = from.x + "px"; c.style.top = from.y + "px";
          const dx = to.x - from.x, dy = to.y - from.y;
          const launch = trav - 0.25 + i * 0.12;
          const plate = c.querySelector(".plate");
          tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, launch);
          tl.fromTo(plate, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, launch);
          tl.to(origs[i], { opacity: 0, duration: 0.15, ease: "none" }, launch + 0.04); // crossfade, no doubled text
          tl.to(c, { x: dx, y: dy, duration: CAMD + i * 0.12, ease: MOVE }, trav);
          // the price sits 11 px further right in the devis row than in the mission table: ease it into place
          tl.fromTo(c.querySelector(".c3"), { x: 11 }, { x: 0, duration: CAMD, ease: MOVE }, trav);
          const landAt = trav + CAMD + i * 0.12;
          tl.fromTo(c.querySelector(".c4"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: OUT }, landAt - 0.15);
          tl.to(plate, { boxShadow: "0 0 0 rgba(2,6,23,0)", borderColor: "rgba(226,232,240,0)", backgroundColor: "rgba(255,255,255,0)", duration: 0.4, ease: "power2.out" }, landAt);
        });
        // camera: the whole world slides to the right station
        tl.to(world, { x: -SHIFT, duration: CAMD, ease: MOVE }, trav);
        tl.to(world, { scale: 0.94, duration: 0.7, ease: "power2.inOut" }, trav);
        tl.to(world, { scale: 1, duration: 0.7, ease: "power2.inOut" }, trav + 0.7);
        tl.to(q, { opacity: 0, duration: 0.7, ease: "power2.inOut" }, trav + 0.7);

        K.pop(tl, $("#s03-mfrom"), trav + 1.1, { d: 0.5 });

        // ── 7. total row, the exact match, title ─────────────
        const tt = trav + CAMD + 0.0;
        const mtl = $("#s03-mtl"), amtwrap = $("#s03-amtwrap"), madEl = $("#s03-cur-mad");
        tl.fromTo([mtl, amtwrap, madEl], { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.6, ease: OUT, stagger: 0.08 }, tt);
        const ghost = $("#s03-ghost"), amt = $("#s03-amt");
        tl.fromTo(ghost, { opacity: 0, x: -360 }, { opacity: 1, x: 0, duration: 0.65, ease: OUT }, tt + 0.2);
        tl.to(amt, { color: "#15803d", duration: 0.35, ease: "power2.out" }, tt + 0.85);
        tl.to(ghost, { opacity: 0, duration: 0.35, ease: "power2.in" }, tt + 0.95);
        K.pop(tl, $("#s03-eq"), tt + 0.85, { from: 0.6, d: 0.5 });
        // title: its idea ("in one click") lands at the click; fully read >= 2.2 s before the exit
        K.title(tl, $("#s03-title"), Math.min(T.click + 0.3, T.out - 3.4));

        K.camOut(tl, cam, T.out);
        window.__timelines["s03"] = tl;
      </script>
    </template>
  </body>
