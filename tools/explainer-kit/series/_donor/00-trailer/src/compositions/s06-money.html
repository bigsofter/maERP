      <div id="s06-root" data-composition-id="s06" data-width="1920" data-height="1080">

                    <div class="lab">{{copy:demo.bank2_label}}</div>

                    <div></div>

                      <div class="stack">
                        <span class="k-pill is-amber" id="s06-p2a"><span class="k-dot"></span>{{ui:web.treasury.st_unmatched}}</span>

                <div class="slot"><span class="bar up" style="height:200px"></span></div>
                <div class="slot"><span class="bar up" style="height:175px"></span></div>
                <div class="slot"><span class="bar up" style="height:150px"></span></div>
                <div class="slot"><span class="bar up" style="height:190px"></span></div>
                <div class="slot"><span class="bar up" style="height:115px"></span></div>

        <script type="application/json" id="s06-sfx">[
          {"cue":"money","off":-0.2,"type":"whoosh","gain":0.5},
          {"cue":"money","off":0.15,"type":"type","gain":0.6},
          {"cue":"bank","off":0.3,"type":"pop","gain":0.7},
          {"cue":"bank","off":0.4,"type":"stamp","gain":0.5},
          {"cue":"confirm","off":0.9,"type":"click","gain":0.8},
          {"cue":"confirm","off":1.05,"type":"pop","gain":0.6},
          {"cue":"forecast","off":-0.5,"type":"whoosh","gain":0.5},
          {"cue":"forecast","off":0.9,"type":"type","gain":0.35},
          {"cue":"week","off":-0.1,"type":"pop","gain":0.6},
          {"cue":"week","off":0.5,"type":"click","gain":0.7},
          {"cue":"week","off":0.3,"type":"swell","gain":0.4}
        ]</script>

      <script>
        const T = {{T}};
        const q = (s) => document.querySelector("#s06-root " + s);
        const qa = (s) => Array.from(document.querySelectorAll("#s06-root " + s));
        const tl = gsap.timeline({ paused: true });
        const OUT = K.OUT;
        // in-place crossfade for the status pills: old fades out first, new settles in after, no ghosting
        const swapPill = (oldEl, newEl, at) => {
          tl.to(oldEl, { opacity: 0, duration: 0.2, ease: "power2.in" }, at);
          tl.fromTo(newEl, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.45, ease: OUT }, at + 0.22);
        };

        const cam = q(".cam"), world = q(".world"), cur = q("#s06-cur");
        K.camIn(tl, cam, 0);
        K.camOut(tl, cam, T.out);

        // ── 1. bank card and the three statement lines ──
        tl.fromTo(q("#s06-bank"), { opacity: 0, y: 46, rotationX: 5, transformPerspective: 1600 },
          { opacity: 1, y: 0, rotationX: 0, duration: 0.9, ease: OUT }, T.money - 0.25);
        K.rise(tl, [q("#s06-r1"), q("#s06-r2"), q("#s06-r3")], T.money + 0.15, { stagger: 0.14, y: 24, d: 0.7 });

        // ── 2. line 1 is matched by itself: the invoice tag snaps against it ──
        const tag = q("#s06-tag");
        tl.fromTo(tag, { x: 70, opacity: 0 }, { x: -4, opacity: 1, duration: 0.4, ease: OUT }, T.bank - 0.1);
        tl.to(tag, { x: 0, duration: 0.18, ease: "power2.out" }, T.bank + 0.3);
        tl.fromTo(q("#s06-link"), { scaleX: 0, opacity: 1 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: OUT }, T.bank + 0.3);
        tl.to(q("#s06-link"), { opacity: 0.25, duration: 0.8, ease: "power2.inOut" }, T.bank + 1.1);
        tl.fromTo(q("#s06-tint1"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, T.bank + 0.35);
        swapPill(q("#s06-p1a"), q("#s06-p1b"), T.bank + 0.35);
        K.pop(tl, q("#s06-auto"), T.bank + 0.6);
        K.pop(tl, q("#s06-why1"), T.bank + 0.78);

        // ── 3. line 2 is only a suggestion: a person confirms it ──
        const r2 = q("#s06-r2"), panel = q("#s06-panel"), cand = q("#s06-cand");
        const dimRows = [q("#s06-r1"), q("#s06-r3")];
        const ck = Math.min(T.confirm + 0.9, T.forecast - 1.2);
        const tx = 1180, ty = 538;
        tl.to(dimRows, { opacity: 0.4, duration: 0.5, ease: "power2.inOut" }, T.confirm - 0.2);
        tl.fromTo(r2, { height: 104 }, { height: 244, duration: 0.7, ease: "power2.inOut" }, T.confirm - 0.2);
        tl.to(panel, { opacity: 1, duration: 0.5, ease: "power2.out" }, T.confirm + 0.1);
        tl.set(cur, { x: 1640, y: 790, opacity: 0 }, 0);
        tl.to(cur, { opacity: 1, duration: 0.25, ease: "none" }, ck - 0.95);
        K.cursorTo(tl, cur, tx, ty, ck - 0.9, 0.85);
        tl.to(cand, { backgroundColor: "#eff6ff", duration: 0.3, ease: "power2.out" }, ck - 0.2);
        K.click(tl, cur, cand, ck);
        tl.set(q("#s06-rip1"), { x: tx, y: ty, opacity: 0.95, scale: 0.25 }, ck);
        tl.to(q("#s06-rip1"), { opacity: 0, scale: 1.7, duration: 0.65, ease: "power2.out" }, ck);
        tl.to(panel, { opacity: 0, duration: 0.3, ease: "power2.in" }, ck + 0.12);
        tl.to(r2, { height: 104, duration: 0.6, ease: "power2.inOut" }, ck + 0.15);
        tl.to(dimRows, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, ck + 0.2);
        swapPill(q("#s06-p2a"), q("#s06-p2b"), ck + 0.15);
        tl.to(cur, { opacity: 0, duration: 0.3, ease: "power2.in" }, ck + 0.4);

        // ── 4. camera travels down to the forecast ──
        tl.to(world, { y: -1050, duration: 1.4, ease: K.MOVE }, T.forecast - 0.5);
        tl.fromTo(q("#s06-floor"), { scaleX: 0, opacity: 0.0 }, { scaleX: 1, opacity: 1, duration: 0.8, ease: OUT }, T.forecast + 0.4);
        K.pop(tl, q("#s06-legend"), T.forecast + 0.7, { from: 0.9 });
        K.rise(tl, qa("#s06-xl span"), T.forecast + 0.8, { y: 10, stagger: 0.035, d: 0.5 });
        const bars = qa("#s06-chart .bar");
        tl.fromTo(bars, { scaleY: 0 }, { scaleY: 1, duration: 0.85, ease: OUT, stagger: 0.07 }, T.forecast + 0.75);
        K.rise(tl, [q("#s06-cap")], T.forecast + 1.5, { y: 10, d: 0.6 });

        // ── 5. week 6 lights up and opens ──
        const w6 = q("#s06-w6");

        const otherLabels = qa("#s06-xl span").filter((s) => !s.classList.contains("w6"));
        tl.to(others, { opacity: 0.35, filter: "blur(2px)", duration: 0.45, ease: "power2.out" }, T.week - 0.15);

        tl.fromTo(q("#s06-hl"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, T.week - 0.15);
        K.pop(tl, q("#s06-vcard"), T.week + 0.05, { from: 0.75, d: 0.5 });

        // cursor: screen coordinates after the camera move (forecast card top = 100, week 6 centre x = 852)
        const wx = 856, wy = 620;
        tl.set(cur, { x: 1480, y: 860 }, T.week - 1.3);
        tl.to(cur, { opacity: 1, duration: 0.25, ease: "none" }, T.week - 1.2);
        K.cursorTo(tl, cur, wx, wy, T.week - 1.05, 0.9);
        K.click(tl, cur, null, T.week + 0.45);
        tl.set(q("#s06-rip2"), { x: wx, y: wy, opacity: 0.95, scale: 0.25 }, T.week + 0.45);
        tl.to(q("#s06-rip2"), { opacity: 0, scale: 1.7, duration: 0.65, ease: "power2.out" }, T.week + 0.45);

        K.rise(tl, qa("#s06-detail .item"), T.week + 1.0, { y: 18, stagger: 0.2, d: 0.6 });
        K.title(tl, q("#s06-title"), Math.min(T.week + 0.2, T.out - 3.4));

        window.__timelines["s06"] = tl;
      </script>
