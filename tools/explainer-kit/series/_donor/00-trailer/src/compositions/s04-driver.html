      <script>
        const T = {{T}};
        const R = document.getElementById("s04-root");
        const q = (s) => R.querySelector(s);
        const tl = gsap.timeline({ paused: true });
        const OUT = K.OUT, MOVE = K.MOVE, IN = K.IN;

        // ── geometry helpers (world coordinates, 1920x1080) ──
        const bez = (a, c, b, t) => { const u = 1 - t; return { x: u * u * a.x + 2 * u * t * c.x + t * t * b.x, y: u * u * a.y + 2 * u * t * c.y + t * t * b.y }; };
        // moves el (top-left at 0,0, size w x h) along a quad bezier by its centre; optional scale and thread callback
        function fly(el, w, h, a, c, b, at, d, ease, s0, s1, onP) {
          const pr = { p: 0 };
          tl.fromTo(pr, { p: 0 }, { p: 1, duration: d, ease, onUpdate: () => {
            const t = pr.p, pt = bez(a, c, b, t);
            gsap.set(el, { x: pt.x - w / 2, y: pt.y - h / 2, scale: s0 + (s1 - s0) * t });
            if (onP) onP(t);
          } }, at);
        }
        function tapRipple(el, x, y, at) {
          gsap.set(el, { x, y, opacity: 0 });
          tl.fromTo(el, { opacity: 0, scale: 0.3 }, { opacity: 0.9, scale: 0.7, duration: 0.07, ease: "none" }, at);
          tl.to(el, { opacity: 0, scale: 1.5, duration: 0.55, ease: "power2.out" }, at + 0.07);
        }

        // ── route strip geometry (local to the strip, 1060 x 70) ──
        const X0 = 60, XM = 530, XL = 900, X1 = 1000, RY = 46;
        const routeY = (x) => {
          if (x < XM) return RY + 5 * Math.sin(((x - X0) / (XM - X0)) * Math.PI * 8);
          if (x < XL) { const ph = ((x - XM) % 60) / 60; return RY - 14 * (ph < 0.5 ? ph * 2 : 2 - ph * 2); }
          return RY;
        };
        let dd = "M" + X0 + " " + routeY(X0).toFixed(1);
        for (let x = X0 + 5; x <= XL; x += 5) dd += " L" + x + " " + routeY(x).toFixed(1);
        q("#s04-route-dash").setAttribute("d", dd);
        q("#s04-route-solid").setAttribute("d", "M" + XL + " " + RY + " L" + X1 + " " + RY);

        // ── geometry of the code flight ──
        const DLG_TOP = 390, DIG_CY = DLG_TOP + 186;          // digit centre row inside the dialog
        const BOX_Y = 492.3;                                  // phone code boxes, world y
        const CODE = "{{copy:demo.code}}".split("");
        const digitsHost = q("#s04-digits");
        const dgs = [], dgis = [], dgcs = [];
        CODE.forEach((ch, i) => {
          const o = document.createElement("div"); o.className = "dg";
          const inn = document.createElement("div"); inn.className = "dgi"; inn.textContent = ch;
          const chip = document.createElement("div"); chip.className = "dgc"; chip.textContent = ch;
          o.appendChild(inn); o.appendChild(chip); digitsHost.appendChild(o);
          dgs.push(o); dgis.push(inn); dgcs.push(chip);
          gsap.set(o, { x: 330 + 90 * i - 45, y: DIG_CY - 60 });
        });
        digitsHost.style.cssText = "position:absolute;left:0;top:0;width:0;height:0;z-index:25";

        // ── static initial states ──
        gsap.set(q("#s04-phthumb"), { rotation: -4 });
        gsap.set(q("#s04-flythumb"), { x: 1390 - 57, y: 562 - 70, opacity: 0 });
        gsap.set(q("#s04-packet"), { x: 1515 - 62, y: 544 - 29, opacity: 0 });
        gsap.set(q("#s04-cursor"), { x: 600, y: 190 });
        gsap.set(q("#s04-truck"), { x: X0 - 26, y: RY - 17 });

        // ── derived times (every one hangs off a cue) ──
        const clk = T.code - 1.5;                       // click on "invite"
        const FLS = 0.1, FLD = 0.3;                      // digit flip stagger / duration
        const flipEnd = clk + 0.25 + FLS * 5 + FLD;
        const fb = flipEnd + 0.4;                        // first digit leaves the dialog
        const FD = 0.38, FS = 0.06;                      // flight duration / stagger
        const landEnd = fb + FS * 5 + FD;
        const X = landEnd + 0.1;                         // "sign in" pressed
        const tapT = T.tap + 0.05;                       // status tile pressed
        const t1in = tapT + 0.4;
        const t1out = T.ferry - 0.4;
        const sg = T.ferry + 1.1;                        // signal returns on solid land

        // ── scene entrance ──
        K.camIn(tl, q(".cam"), 0);

        // 1. phone + office card arrive
        tl.fromTo(q("#s04-phonewrap"), { x: 300, rotationY: -18, scale: 0.9, opacity: 0, transformPerspective: 1600 }, { x: 0, rotationY: -6, scale: 0.9, opacity: 1, transformPerspective: 1600, duration: 1.0, ease: OUT }, T.driver - 0.3);
        tl.fromTo(q("#s04-office"), { x: -140, y: 40, rotationY: 9, opacity: 0, transformPerspective: 1600 }, { x: 0, y: 0, rotationY: 0, opacity: 1, transformPerspective: 1600, duration: 1.0, ease: OUT }, T.driver - 0.2);

        // 2. invite click, code dialog
        const cur = q("#s04-cursor");
        tl.fromTo(cur, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, clk - 0.85);
        K.cursorTo(tl, cur, 771, 324, clk - 0.8, 0.7);
        K.click(tl, cur, q("#s04-invite"), clk);
        tapRipple(q("#s04-ripple"), 780, 330, clk);
        tl.to(cur, { opacity: 0, duration: 0.3, ease: IN }, clk + 0.35);
        tl.to(q("#s04-list"), { opacity: 0.4, filter: "blur(2px)", duration: 0.4, ease: "power2.out" }, clk + 0.1);
        tl.fromTo(q("#s04-dialog"), { opacity: 0, y: 50, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: OUT }, clk + 0.1);
        dgis.forEach((inn, i) => {
          tl.fromTo(inn, { opacity: 0, rotationX: -90, transformPerspective: 700 }, { opacity: 1, rotationX: 0, transformPerspective: 700, duration: FLD, ease: OUT }, clk + 0.25 + FLS * i);
        });
        tl.fromTo(q("#s04-expires"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: OUT }, clk + 0.2);

        // digits fly into the phone boxes, rightmost first so none passes through a neighbour
        dgs.forEach((o, i) => {
          const a = { x: 330 + 90 * i, y: DIG_CY }, b = { x: 1366.5 + 59.4 * i, y: BOX_Y };
          const c = { x: (a.x + b.x) / 2, y: 330 };
          const st = fb + FS * (5 - i);
          tl.set(dgcs[i], { opacity: 1 }, st);
          tl.set(dgis[i], { opacity: 0 }, st);
          fly(o, 90, 120, a, c, b, st, FD, "power1.inOut", 1, 0.55);
          tl.to(o, { opacity: 0, duration: 0.1, ease: "none" }, st + FD - 0.06);
          const box = q("#s04-cb" + i), cd = box.querySelector(".cd");
          tl.fromTo(cd, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: OUT }, st + FD - 0.04);
          tl.to(box, { borderColor: "#fde68a", duration: 0.2, ease: "none" }, st + FD - 0.04);
        });
        tl.to(q("#s04-dialog"), { opacity: 0, y: 24, duration: 0.4, ease: IN }, fb + 0.5);
        tl.to(q("#s04-list"), { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, fb + 0.55);

        // sign in
        tapRipple(q("#s04-tap1"), 1515, 612, X);
        tl.to(q("#s04-verify"), { scale: 0.95, duration: 0.09, ease: "power2.out" }, X).to(q("#s04-verify"), { scale: 1, duration: 0.25, ease: "power2.out" }, X + 0.09);

        // 3. screens switch: login clears first, then the mission screen settles
        tl.to(q("#s04-login"), { opacity: 0, duration: 0.25, ease: "power2.in" }, X + 0.12);
        tl.fromTo(q("#s04-mission"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: OUT }, X + 0.3);
        tl.to(q("#s04-list"), { opacity: 0, duration: 0.3, ease: "power2.in" }, X + 0.15);
        tl.fromTo(q("#s04-mview"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, X + 0.3);

        // 4. the tap: status moves from phone to office
        tapRipple(q("#s04-tap2"), 1515, 544, tapT);
        tl.to(q("#s04-tile"), { scale: 0.96, duration: 0.09, ease: "power2.out" }, tapT).to(q("#s04-tile"), { scale: 1, duration: 0.3, ease: "power2.out" }, tapT + 0.09);
        K.swap(tl, q("#s04-pl1"), q("#s04-pl2"), tapT + 0.05);
        // packet along the thread
        const th = q("#s04-thread-path");
        const pa = { x: 1515, y: 544 }, pc = { x: 1200, y: 300 }, pb = { x: 864, y: 500 };
        tl.fromTo(q("#s04-packet"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, tapT + 0.15);
        fly(q("#s04-packet"), 124, 58, pa, pc, pb, tapT + 0.2, 0.9, MOVE, 1, 0.85, (t) => gsap.set(th, { strokeDashoffset: 1 - t }));
        tl.to(q("#s04-packet"), { opacity: 0, duration: 0.2, ease: IN }, tapT + 1.02);
        tl.to(q("#s04-thread"), { opacity: 0, duration: 0.7, ease: "power2.in" }, tapT + 1.6);
        tl.fromTo(q("#s04-event"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: OUT }, tapT + 1.1);
        tl.fromTo(q("#s04-dot3"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: OUT }, tapT + 1.1);
        // the phone calms down: the used tile and its label leave, the rest slides up
        tl.to([q("#s04-tile"), q(".ms-label")], { opacity: 0, duration: 0.25, ease: IN }, tapT + 0.45);
        tl.to(q("#s04-lower"), { y: -260, duration: 0.7, ease: MOVE }, tapT + 1.0);
        K.title(tl, q("#s04-title1"), t1in);

        // 5. network drops, a photo waits
        tl.fromTo(q("#s04-banner"), { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.5, ease: OUT }, T.photo - 0.2);
        tl.to(q("#s04-sigslash"), { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, T.photo - 0.15);
        tl.to(q("#s04-sigbars"), { opacity: 0.4, duration: 0.3, ease: "none" }, T.photo - 0.1);
        tapRipple(q("#s04-tap3"), 1515, 441, T.photo + 0.15);
        tl.to(q("#s04-photobtn"), { scale: 0.96, duration: 0.09, ease: "power2.out" }, T.photo + 0.15).to(q("#s04-photobtn"), { scale: 1, duration: 0.3, ease: "power2.out" }, T.photo + 0.24);
        tl.fromTo(q("#s04-phthumb"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: OUT }, T.photo + 0.35);
        K.pop(tl, q("#s04-cap1"), T.photo + 0.6);
        K.pop(tl, q("#s04-q1"), T.photo + 0.85);
        K.titleOut(tl, q("#s04-title1"), t1out);

        // 6. ferry and mountains
        const strip = q("#s04-strip");
        tl.fromTo(strip, { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.6, ease: OUT }, T.ferry - 0.6);
        const truck = q("#s04-truck"), pr = { p: 0 };
        const dotB = q("#s04-dotB"), dotC = q("#s04-dotC");
        gsap.set([dotB, dotC], { opacity: 0.3 });
        tl.fromTo(pr, { p: 0 }, { p: 1, duration: 1.7, ease: "power1.inOut", onUpdate: () => {
          const x = X0 + (X1 - X0) * pr.p;
          gsap.set(truck, { x: x - 26, y: routeY(x) - 17 });
          gsap.set(dotB, { opacity: x >= XM ? 1 : 0.3 });
          gsap.set(dotC, { opacity: x >= X1 - 2 ? 1 : 0.3 });
        } }, T.ferry - 0.3);
        tl.fromTo(q("#s04-nosig1"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, T.ferry - 0.25);
        tl.fromTo(q("#s04-nosig2"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, T.ferry + 0.45);
        // signal returns on solid land
        tl.to([q("#s04-nosig1"), q("#s04-nosig2")], { opacity: 0, duration: 0.4, ease: "power2.in" }, sg - 0.1);
        tl.to(q("#s04-banner"), { opacity: 0, y: -30, duration: 0.45, ease: IN }, sg);
        tl.to(q("#s04-sigslash"), { strokeDashoffset: 1, duration: 0.3, ease: "power2.in" }, sg);
        tl.to(q("#s04-sigbars"), { opacity: 1, duration: 0.3, ease: "none" }, sg);
        K.swap(tl, q("#s04-q1"), q("#s04-q2"), sg + 0.1);
        K.swap(tl, q("#s04-cap1"), q("#s04-cap2"), sg + 0.1);
        // photo flies into the dossier (the office only receives it now)
        const ft = sg + 0.15, fd = 0.8;
        tl.fromTo(q("#s04-flythumb"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, ft);
        fly(q("#s04-flythumb"), 114, 140, { x: 1390, y: 562 }, { x: 800, y: 560 }, { x: 202, y: 723 }, ft, fd, MOVE, 1, 1.05);
        tl.to(q("#s04-flythumb"), { opacity: 0, duration: 0.2, ease: "none" }, ft + fd - 0.05);
        tl.fromTo(q("#s04-slot"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, ft + fd - 0.1);
        tl.fromTo(q("#s04-attach-label"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: OUT }, ft + fd - 0.5);
        K.pop(tl, q("#s04-tag"), ft + fd - 0.05);
        K.title(tl, q("#s04-title2"), T.ferry + 0.2);

        // ── exit ──
        K.camOut(tl, q(".cam"), T.out);
        window.__timelines["s04"] = tl;
      </script>
    </template>
  </body>
</html>
