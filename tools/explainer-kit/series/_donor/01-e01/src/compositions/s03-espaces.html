              <div class="k-card-b" style="padding:30px 36px;">
                <div style="display:flex; gap:24px; margin-bottom:30px;">
                  <div class="stat"><div class="sk" style="width:40%; margin-bottom:22px;"></div><div class="sk" style="height:34px; width:75%; background:var(--brand-tint);"></div></div>
                  <div class="stat"><div class="sk" style="width:46%; margin-bottom:22px;"></div><div class="sk" style="height:34px; width:60%; background:var(--brand-tint);"></div></div>
                  <div class="stat"><div class="sk" style="width:34%; margin-bottom:22px;"></div><div class="sk" style="height:34px; width:70%; background:var(--brand-tint);"></div></div>
                </div>
                <div class="trow"><div class="sk" style="width:60px;"></div><div class="sk" style="flex:1;"></div><div class="sk" style="width:120px;"></div></div>
                <div class="trow"><div class="sk" style="width:60px;"></div><div class="sk" style="flex:1; margin-right:80px;"></div><div class="sk" style="width:120px;"></div></div>
                <div class="trow"><div class="sk" style="width:60px;"></div><div class="sk" style="flex:1; margin-right:30px;"></div><div class="sk" style="width:120px;"></div></div>
                <div class="trow"><div class="sk" style="width:60px;"></div><div class="sk" style="flex:1; margin-right:140px;"></div><div class="sk" style="width:120px;"></div></div>
              </div>
            </div>

            <div class="k-ripple" id="s03-ripple"></div>
            <div class="k-cursor" id="s03-cursor"><svg viewBox="0 0 46 46" width="46" height="46" style="display:block;"><path d="M6 4 L6 34 L14 27 L20 40 L26 37 L20 25 L31 25 Z" fill="#fff" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/></svg></div>
          </div>

          <div class="k-title" id="s03-t1"><div class="k-title-bar"></div><div class="k-title-text">{{copy:s03.title1}}</div></div>
          <div class="k-title" id="s03-t2"><div class="k-title-bar"></div><div class="k-title-text">{{copy:s03.title2}}</div></div>
        </div>

        <script type="application/json" id="s03-sfx">[
          {"cue":"tick","off":-0.05,"type":"click","gain":0.9},
          {"cue":"tick","off":1.0,"type":"click","gain":0.9},
          {"cue":"tick","off":1.12,"type":"pop","gain":0.6},
          {"cue":"roles","off":-0.05,"type":"pop","gain":0.7},
          {"cue":"roles","off":0.75,"type":"pop","gain":0.7},
          {"cue":"phone","off":-0.1,"type":"whoosh","gain":0.45},
          {"cue":"phone","off":1.6,"type":"pop","gain":0.35},
          {"cue":"phone","off":1.85,"type":"pop","gain":0.35},
          {"cue":"phone","off":2.1,"type":"pop","gain":0.35},
          {"cue":"cmdk","off":0.62,"type":"key","gain":0.8},
          {"cue":"cmdk","off":0.76,"type":"key","gain":0.8},
          {"cue":"cmdk","off":1.3,"type":"key","gain":0.6},
          {"cue":"cmdk","off":1.6,"type":"key","gain":0.6},
          {"cue":"cmdk","off":1.9,"type":"key","gain":0.6},
          {"cue":"bank","off":0.0,"type":"click","gain":0.6},
          {"cue":"bank","off":1.05,"type":"pop","gain":0.5}
        ]</script>
      </div>

      <script>
        const T = {{T}};
        const tl = gsap.timeline({ paused: true });
        const $ = (s) => document.querySelector(s);
        const OUT = K.OUT, MOVE = K.MOVE, IN = K.IN;

        /* the phone shows the SAME rail (one portal layout), scaled down: clone it in its final 3-espace state */
        (function () {
          const src = $("#s03-rail");
          const wrap = document.createElement("div"); wrap.className = "phrail";
          const c = src.cloneNode(true);
          c.removeAttribute("id");
          c.querySelectorAll("[id]").forEach((n) => n.removeAttribute("id"));
          const secs = c.querySelectorAll(".sec");           /* expl, parc, fin, dir */
          secs[0].style.top = "96px"; secs[1].style.top = "286px"; secs[3].style.top = "432px";
          secs[2].remove();
          c.querySelectorAll(".cnt span")[0].style.opacity = "0";
          c.querySelectorAll(".cnt span")[1].style.opacity = "1";
          c.style.opacity = "1"; c.style.transform = "none";
          wrap.appendChild(c);
          $("#s03-phscreen").appendChild(wrap);
          window.__s03ph = Array.from(wrap.querySelectorAll(".sec"));
        })();
        const phSecs = window.__s03ph;
        const cam = $("#s03-cam");
        const railwrap = $("#s03-railwrap"), rail = $("#s03-rail");
        const cursor = $("#s03-cursor"), ripple = $("#s03-ripple");
        const t1 = $("#s03-t1"), t2 = $("#s03-t2");
        K.splitWords(t1.querySelector(".k-title-text"));
        K.splitWords(t2.querySelector(".k-title-text"));

        /* split the query into characters (typed one by one) */
        const qHost = $("#s03-qchars");
        const qText = qHost.textContent;
        qHost.textContent = "";
        const chars = [];
        for (const c of qText) { const s = document.createElement("span"); s.className = "ch"; s.textContent = c; qHost.appendChild(s); chars.push(s); }

        /* thread geometry */
        const path = $("#s03-wirepath"), dot = $("#s03-dot");
        const PL = path.getTotalLength();
        path.style.strokeDasharray = PL;

        /* ── resting states for things that wait ── */
        tl.set(phSecs, { opacity: 0 }, 0);
        tl.set([$("#s03-pop"), $("#s03-pc1"), $("#s03-pc2"), $("#s03-laptop"), $("#s03-phone"), $("#s03-wire"), $("#s03-kc1"), $("#s03-kc2"), $("#s03-kh"), $("#s03-pal"), $("#s03-page"), cursor, ripple, t1, t2], { opacity: 0 }, 0);
        tl.set([$("#s03-parc"), $("#s03-fin"), $("#s03-cnt3"), $("#s03-n3"), $("#s03-gl"), $("#s03-hl1"), $("#s03-ck1"), $("#s03-prow"), $("#s03-gbadge")], { opacity: 0 }, 0);

        /* 1 ── camera in, rail arrives */
        const S0 = 0.4;                                  /* incoming seam: the first 0.35 s stay empty */
        K.camIn(tl, cam, S0 - 0.05);
        tl.fromTo(rail, { opacity: 0, rotationY: 8, x: -40, transformPerspective: 1600 }, { opacity: 1, rotationY: 0, x: 0, duration: 0.9, ease: OUT }, S0);

        /* 2 ── cursor → switcher → click → popup */
        const cs = 0.5;
        tl.set(cursor, { x: 1060, y: 600, opacity: 0 }, 0);
        tl.to(cursor, { opacity: 1, duration: 0.25, ease: "none" }, cs);
        K.cursorTo(tl, cursor, 472, 156, cs, T.tick - 0.1 - cs);
        K.click(tl, cursor, $("#s03-switch"), T.tick - 0.05, ripple, 478, 160);
        tl.fromTo($("#s03-pop"), { opacity: 0, y: -10, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: OUT }, T.tick + 0.1);
        tl.fromTo(["#s03-pr0", "#s03-pr1", "#s03-pr2", "#s03-pr3"].map($), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: OUT, stagger: 0.06 }, T.tick + 0.2);
        K.title(tl, t1, T.tick + 0.8);

        /* cursor → Parc row, click, tick appears, count 2→3, new section slides in */
        K.cursorTo(tl, cursor, 900, 326, T.tick + 0.25, 0.7);
        const tp = T.tick + 1.0;
        K.click(tl, cursor, $("#s03-pr1"), tp, ripple, 906, 330);
        tl.fromTo($("#s03-hl1"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, tp + 0.08);
        tl.fromTo($("#s03-ck1"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: OUT }, tp + 0.1);
        K.swap(tl, $("#s03-cnt2"), $("#s03-cnt3"), tp + 0.12, 0.35);
        tl.fromTo($("#s03-dir"), { y: 0 }, { y: 146, duration: 0.5, ease: MOVE, immediateRender: false }, tp + 0.15);
        tl.fromTo($("#s03-parc"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.55, ease: OUT }, tp + 0.5);
        tl.to(cursor, { opacity: 0, duration: 0.3, ease: IN }, tp + 0.7);

        /* 3 ── popup closes, two personas; the rail steps back */
        tl.to($("#s03-pop"), { opacity: 0, y: -8, duration: 0.3, ease: IN }, T.roles - 0.15);
        tl.to(railwrap, { opacity: 0.4, filter: "blur(2.5px)", duration: 0.5, ease: "power2.out" }, T.roles - 0.1);
        tl.fromTo($("#s03-pc1"), { opacity: 0, y: 36, rotationY: -8, transformPerspective: 1600 }, { opacity: 1, y: 0, rotationY: 0, duration: 0.8, ease: OUT }, T.roles - 0.05);
        tl.fromTo($("#s03-pc2"), { opacity: 0, y: 36, rotationY: -8, transformPerspective: 1600 }, { opacity: 1, y: 0, rotationY: 0, duration: 0.8, ease: OUT }, T.roles + 0.7);
        /* "+" ghost lights up: two → three */
        const tg = T.roles + 1.7;
        tl.to($("#s03-gh"), { opacity: 0, duration: 0.3, ease: "none" }, tg);
        tl.fromTo($("#s03-gl"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: OUT }, tg);
        K.swap(tl, $("#s03-n2"), $("#s03-n3"), tg, 0.35);

        /* 4 ── laptop → phone: the choice follows you */
        tl.to([$("#s03-pc1"), $("#s03-pc2")], { opacity: 0, y: -14, duration: 0.4, ease: IN }, T.phone - 0.25);
        tl.to(railwrap, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power2.out" }, T.phone - 0.25);
        const RX = 315, RY = 48, RS = 0.85;              /* laptop rail: 0.85, pair centred with the phone */
        tl.fromTo(railwrap, { x: 0, y: 0, scale: 1 }, { x: RX, y: RY, scale: RS, duration: 1.0, ease: MOVE, immediateRender: false }, T.phone - 0.2);
        tl.fromTo($("#s03-laptop"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: OUT }, T.phone + 0.6);
        tl.fromTo($("#s03-phone"), { opacity: 0, x: 50, rotationY: -10, transformPerspective: 1600 }, { opacity: 1, x: 0, rotationY: 0, duration: 0.9, ease: OUT }, T.phone - 0.05);
        /* thread draws from the switcher to the phone, a dot rides it; it fades WITH the thread */
        const tw = T.phone + 0.95, twd = 0.85;
        tl.set($("#s03-wire"), { opacity: 1 }, tw);
        tl.fromTo(path, { strokeDashoffset: PL }, { strokeDashoffset: 0, duration: twd, ease: "power2.inOut" }, tw);
        const prog = { p: 0 };
        tl.fromTo(prog, { p: 0 }, { p: 1, duration: twd, ease: "power2.inOut", onUpdate: () => {
          const pt = path.getPointAtLength(prog.p * PL);
          dot.setAttribute("cx", pt.x.toFixed(1)); dot.setAttribute("cy", pt.y.toFixed(1));
        } }, tw);
        tl.fromTo(dot, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, tw);
        tl.to(dot, { opacity: 0, duration: 0.2, ease: "none" }, tw + twd - 0.05);
        /* the three espaces arrive on the phone, in order */
        phSecs.forEach((el, i) => {
          tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: OUT }, tw + twd + 0.05 + i * 0.28);
        });

        /* 5 ── ⌘K: the rail comes back, keycaps press, palette opens */
        K.titleOut(tl, t1, T.cmdk - 0.5);
        const tb = T.cmdk - 0.1;
        tl.to([$("#s03-phone"), $("#s03-laptop")], { opacity: 0, duration: 0.35, ease: IN }, tb);
        tl.to($("#s03-wire"), { opacity: 0, duration: 0.3, ease: IN }, tw + twd + 0.9 < tb ? tw + twd + 0.9 : tb);
        tl.fromTo(railwrap, { x: RX, y: RY, scale: RS }, { x: 0, y: 0, scale: 1, duration: 1.0, ease: MOVE, immediateRender: false }, tb);
        tl.fromTo([$("#s03-kc1"), $("#s03-kc2")], { opacity: 0, y: 30, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: OUT, stagger: 0.08 }, T.cmdk + 0.2);
        const press = (el, at) => {
          tl.to(el, { y: 8, duration: 0.09, ease: "power2.out" }, at);
          tl.to(el, { y: 0, duration: 0.25, ease: "power2.out" }, at + 0.1);
        };
        press($("#s03-kc1"), T.cmdk + 0.62);
        press($("#s03-kc2"), T.cmdk + 0.76);
        tl.to([$("#s03-kc1"), $("#s03-kc2")], { opacity: 0, y: -20, duration: 0.2, ease: IN }, T.cmdk + 0.98);
        tl.fromTo($("#s03-kh"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: OUT }, T.cmdk + 0.5);
        tl.to($("#s03-kh"), { opacity: 0, duration: 0.35, ease: IN }, T.cmdk + 2.4);
        tl.fromTo($("#s03-pal"), { opacity: 0, y: 24, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: OUT }, T.cmdk + 1.0);
        K.title(tl, t2, T.cmdk + 0.5);

        /* 6 ── typing: the single result appears */
        const ty = T.cmdk + 1.3, step = 0.15;
        tl.to($("#s03-ph"), { opacity: 0, duration: 0.15, ease: "none" }, ty);
        tl.set($("#s03-qchars").nextElementSibling, { opacity: 1 }, ty);
        chars.forEach((c, i) => tl.set(c, { display: "inline", opacity: 1 }, ty + i * step));
        const tr = ty + chars.length * step + 0.1;
        tl.fromTo($("#s03-prow"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: OUT }, tr);

        /* 7 ── Enter: palette closes, the ghost section and the page */
        tl.to($("#s03-prow"), { scale: 0.975, duration: 0.09, ease: "power2.out" }, T.bank);
        tl.to($("#s03-prow"), { scale: 1, duration: 0.25, ease: "power2.out" }, T.bank + 0.09);
        tl.to($("#s03-pal"), { opacity: 0, y: -12, scale: 0.97, duration: 0.3, ease: IN }, T.bank + 0.12);
        tl.fromTo($("#s03-dir"), { y: 146 }, { y: 248, duration: 0.5, ease: MOVE, immediateRender: false }, T.bank + 0.3);
        tl.fromTo($("#s03-fin"), { opacity: 0, x: -30 }, { opacity: 0.8, x: 0, duration: 0.55, ease: OUT }, T.bank + 0.65);
        tl.fromTo($("#s03-gbadge"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: OUT }, T.bank + 1.0);
        tl.fromTo($("#s03-page"), { opacity: 0, x: 70 }, { opacity: 1, x: 0, duration: 0.8, ease: OUT }, T.bank + 0.5);

        K.camOut(tl, cam, T.out);
        window.__timelines["s03"] = tl;
      </script>
    </template>
  </body>
</html>
