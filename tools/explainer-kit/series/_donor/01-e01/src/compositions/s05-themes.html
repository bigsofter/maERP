<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s05-root { position: absolute; inset: 0; overflow: hidden; }
        #s05-root .cam, #s05-root .world { position: absolute; inset: 0; }
        #s05-root .abs { position: absolute; }

        /* ── preview portal ── */
        #s05-root #s05-pv { position: absolute; left: 140px; top: 140px; width: 940px; height: 620px; border-radius: 26px; overflow: hidden; background: #f8fafc; box-shadow: var(--shadow-card); }
        #s05-root .pv-rail { position: absolute; left: 0; top: 0; width: 180px; height: 620px; z-index: 3; }
        #s05-root .pv-mainw { position: absolute; left: 180px; top: 0; width: 760px; height: 620px; z-index: 2; }
        #s05-root .rin, #s05-root .main { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
        #s05-root .t-rail { position: absolute; inset: 0; background: #ffffff; }
        #s05-root .t-railline { position: absolute; right: 0; top: 0; bottom: 0; width: 2px; background: #e2e8f0; }
        #s05-root .logo { position: absolute; left: 24px; top: 24px; width: 44px; height: 44px; border-radius: 14px; background: var(--grad-brand); }
        #s05-root .logo-t { position: absolute; left: 80px; top: 38px; width: 70px; height: 16px; border-radius: 8px; background: #cbd5e1; }
        #s05-root .ri { position: absolute; left: 14px; width: 152px; height: 46px; border-radius: 14px; }
        #s05-root .ri .ic { position: absolute; left: 14px; top: 12px; width: 22px; height: 22px; border-radius: 7px; background: #cbd5e1; }
        #s05-root .ri .tx { position: absolute; left: 50px; top: 15px; height: 16px; border-radius: 8px; background: #cbd5e1; }
        #s05-root .ri.is-act { background: rgba(29, 78, 216, 0.12); }
        #s05-root .ri.is-act .ic, #s05-root .ri.is-act .tx { background: #3b82f6; }
        #s05-root .t-top { position: absolute; left: 0; top: 0; right: 0; height: 64px; background: #ffffff; border-bottom: 2px solid #e2e8f0; box-sizing: border-box; }
        #s05-root .t-title { position: absolute; left: 28px; top: 21px; width: 250px; height: 22px; border-radius: 11px; background: #cbd5e1; }
        #s05-root .t-av { position: absolute; right: 28px; top: 14px; width: 36px; height: 36px; border-radius: 50%; background: #cbd5e1; }
        #s05-root .t-area { position: absolute; left: 0; top: 64px; right: 0; bottom: 0; background: #f8fafc; }
        #s05-root .t-card { position: absolute; border-radius: 18px; background: #ffffff; border: 2px solid #e2e8f0; box-sizing: border-box; }
        #s05-root .bar { position: absolute; height: 16px; border-radius: 8px; background: #e2e8f0; }
        #s05-root .bar.b2 { background: #cbd5e1; }
        #s05-root .bar.big { height: 34px; border-radius: 12px; }
        #s05-root .trow { position: absolute; left: 24px; right: 24px; height: 2px; background: #e2e8f0; }
        #s05-root .acc { position: absolute; height: 16px; border-radius: 8px; background: #93c5fd; }

        /* ── right-hand cards ── */
        #s05-root .pcard { position: absolute; left: 1180px; width: 600px; }
        #s05-root #s05-app { top: 130px; }
        #s05-root #s05-lang { top: 556px; }
        #s05-root .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
        #s05-root .opt { position: relative; height: 56px; border-radius: 28px; border: 2px solid var(--ui-line); background: #fff; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: var(--f-body); font-weight: 600; font-size: 25px; color: var(--ui-ink-3); }
        #s05-root .opt .sel { position: absolute; inset: -2px; border-radius: 28px; border: 2px solid var(--brand); background: var(--brand-tint); opacity: 0; box-sizing: border-box; }
        #s05-root .opt .lb { position: relative; z-index: 1; white-space: nowrap; }
        #s05-root .lrow { display: flex; gap: 14px; }
        #s05-root .lrow .opt { width: 96px; flex: none; font-size: 24px; letter-spacing: 0.04em; }
        #s05-root #s05-hint { margin-top: 20px; min-height: 0; display: flex; align-items: flex-start; gap: 14px; font-family: var(--f-body); font-size: 20px; font-weight: 500; line-height: 1.4; color: #64748b; }
        #s05-root #s05-hint svg { flex: none; width: 30px; height: 30px; margin-top: 0; stroke: #64748b; }
        #s05-root #s05-hint span { max-width: 500px; }
        #s05-root .k-title { max-width: 1380px; }
        #s05-root .ar { position: absolute; left: 40px; top: 8px; width: 110px; text-align: right; direction: rtl; font-family: var(--f-body); font-weight: 600; font-size: 24px; line-height: 30px; color: #cbd5e1; white-space: nowrap; }
        #s05-root .ri.is-act .ar { color: #93c5fd; }
        #s05-root #s05-hint span { text-wrap: balance; }
      </style>

      <div id="s05-root" data-composition-id="s05" data-width="1920" data-height="1080">
        <div class="cam">
          <div class="world">

            <div id="s05-pv">
              <div class="pv-mainw">
                <div class="main" id="s05-main">
                  <div class="t-top"><div class="t-title"></div><div class="t-av"></div></div>
                  <div class="t-area">
                    <div class="t-card" style="left:28px;top:28px;width:340px;height:150px">
                      <div class="bar b2" style="left:24px;top:24px;width:110px"></div>
                      <div class="bar big" style="left:24px;top:62px;width:170px"></div>
                      <div class="acc" style="left:24px;top:112px;width:90px"></div>
                    </div>
                    <div class="t-card" style="left:392px;top:28px;width:340px;height:150px">
                      <div class="bar b2" style="left:24px;top:24px;width:140px"></div>
                      <div class="bar big" style="left:24px;top:62px;width:130px"></div>
                      <div class="acc" style="left:24px;top:112px;width:120px"></div>
                    </div>
                    <div class="t-card" style="left:28px;top:202px;width:704px;height:326px">
                      <div class="bar b2" style="left:24px;top:22px;width:90px"></div>
                      <div class="bar b2" style="left:300px;top:22px;width:90px"></div>
                      <div class="bar b2" style="left:520px;top:22px;width:90px"></div>
                      <div class="trow" style="top:56px"></div>
                      <div class="bar" style="left:24px;top:82px;width:190px"></div><div class="bar" style="left:300px;top:82px;width:120px"></div><div class="bar" style="left:520px;top:82px;width:150px"></div>
                      <div class="trow" style="top:122px"></div>
                      <div class="bar" style="left:24px;top:148px;width:150px"></div><div class="bar" style="left:300px;top:148px;width:160px"></div><div class="bar" style="left:520px;top:148px;width:100px"></div>
                      <div class="trow" style="top:188px"></div>
                      <div class="bar" style="left:24px;top:214px;width:210px"></div><div class="bar" style="left:300px;top:214px;width:100px"></div><div class="bar" style="left:520px;top:214px;width:130px"></div>
                      <div class="trow" style="top:254px"></div>
                      <div class="bar" style="left:24px;top:280px;width:170px"></div><div class="bar" style="left:300px;top:280px;width:140px"></div><div class="bar" style="left:520px;top:280px;width:90px"></div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="pv-rail">
                <div class="rin" id="s05-rin">
                  <div class="t-rail"></div><div class="t-railline"></div>
                  <div class="logo"></div><div class="logo-t"></div>
                  <div data-ar="{{copy:s05.ar1}}" class="ri is-act" style="top:110px"><div class="ic"></div><div class="tx" style="width:70px"></div></div>
                  <div data-ar="{{copy:s05.ar2}}" class="ri" style="top:168px"><div class="ic"></div><div class="tx" style="width:60px"></div></div>
                  <div data-ar="{{copy:s05.ar3}}" class="ri" style="top:226px"><div class="ic"></div><div class="tx" style="width:76px"></div></div>
                  <div data-ar="{{copy:s05.ar4}}" class="ri" style="top:284px"><div class="ic"></div><div class="tx" style="width:56px"></div></div>
                  <div class="ri" style="top:342px"><div class="ic"></div><div class="tx" style="width:68px"></div></div>
                </div>
              </div>
            </div>

            <div id="s05-app" class="pcard k-card">
              <div class="k-card-h"><div class="k-card-t">{{ui:web.profile.appearance}}</div></div>
              <div class="k-card-b">
                <div class="pgrid">
                  <div id="s05-o-light" class="opt"><div class="sel"></div><span class="lb">{{ui:web.profile.theme_light}}</span></div>
                  <div id="s05-o-dusk" class="opt"><div class="sel"></div><span class="lb">{{ui:web.profile.theme_dusk}}</span></div>
                  <div id="s05-o-dark" class="opt"><div class="sel"></div><span class="lb">{{ui:web.profile.theme_dark}}</span></div>
                  <div id="s05-o-auto" class="opt"><div class="sel"></div><span class="lb">{{ui:web.profile.theme_auto}}</span></div>
                </div>
                <div id="s05-hint">
                  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
                  <span>{{ui:web.profile.auto_hint}}</span>
                </div>
              </div>
            </div>

            <div id="s05-lang" class="pcard k-card">
              <div class="k-card-h"><div class="k-card-t">{{ui:web.profile.language}}</div></div>
              <div class="k-card-b">
                <div class="lrow">
                  <div id="s05-l-fr" class="opt"><div class="sel"></div><span class="lb">FR</span></div>
                  <div id="s05-l-ar" class="opt"><div class="sel"></div><span class="lb">AR</span></div>
                  <div id="s05-l-en" class="opt"><div class="sel"></div><span class="lb">EN</span></div>
                  <div id="s05-l-es" class="opt"><div class="sel"></div><span class="lb">ES</span></div>
                  <div id="s05-l-ru" class="opt"><div class="sel"></div><span class="lb">RU</span></div>
                </div>
              </div>
            </div>

            <div id="s05-ripple" class="k-ripple"></div>
            <div id="s05-cursor" class="k-cursor"><svg viewBox="0 0 24 24" width="46" height="46"><path d="M5 3l14 8-6 2-3 6z" fill="#fff" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
          </div>

          <div id="s05-title" class="k-title"><div class="k-title-bar"></div><div class="k-title-text">{{copy:s05.title}}</div></div>
        </div>
      </div>

      <script type="application/json" id="s05-sfx">[
        {"cue":"themes","off":0.3,"type":"click","gain":0.55},
        {"cue":"themes","off":1.6,"type":"click","gain":0.55},
        {"cue":"themes","off":1.75,"type":"swell","gain":0.35},
        {"cue":"auto","off":-0.1,"type":"click","gain":0.55},
        {"cue":"auto","off":0.15,"type":"pop","gain":0.4},
        {"cue":"langs","off":-0.1,"type":"pop","gain":0.4},
        {"cue":"rtl","off":-0.1,"type":"click","gain":0.55},
        {"cue":"rtl","off":0.1,"type":"whoosh","gain":0.5}
      ]</script>

      <script>
        const T = {{T}};
        const R = document.getElementById("s05-root");
        const q = (s) => R.querySelector(s);
        const qa = (s) => R.querySelectorAll(s);
        const tl = gsap.timeline({ paused: true });
        const OUT = K.OUT, MOVE = K.MOVE, IN = K.IN;

        // mirrored twins of the rail contents and the work area (placeholder bars carry no text)
        const mainEl = q("#s05-main"), rinEl = q("#s05-rin");
        [mainEl, rinEl].forEach((el) => {
          const c = el.cloneNode(true);
          c.removeAttribute("id");
          c.classList.add("mir");
          el.parentNode.appendChild(c);
          gsap.set(c, { scaleX: -1, opacity: 0 });
          c.querySelectorAll(".ri[data-ar]").forEach((ri) => {
            ri.querySelector(".tx").style.display = "none";
            const a = document.createElement("div");
            a.className = "ar"; a.textContent = ri.dataset.ar;
            ri.appendChild(a);
            gsap.set(a, { scaleX: -1 });
          });
        });
        const mirs = qa(".mir");
        const origs = [mainEl, rinEl];

        // centre of an element in root coordinates (offset chain: immune to camera transforms)
        function centre(el) {
          let x = 0, y = 0, n = el;
          while (n && n !== R) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
          return { x: x + el.offsetWidth / 2, y: y + el.offsetHeight / 2 };
        }

        // ── theme palettes ──
        const LINE_L = "#e2e8f0", LINE_D = "rgba(148,163,184,0.16)";
        const TH = {
          light: { rail: "#ffffff", rline: LINE_L, ri: "#cbd5e1", act: "rgba(29,78,216,0.12)", actc: "#3b82f6", top: "#ffffff", tline: LINE_L, area: "#f8fafc", card: "#ffffff", cline: LINE_L, bar: "#e2e8f0", b2: "#cbd5e1", title: "#cbd5e1", acc: "#93c5fd", frame: "#f8fafc" },
          dusk:  { rail: "#0d1526", rline: LINE_D, ri: "#4b5b75", act: "rgba(96,165,250,0.16)", actc: "#93c5fd", top: "#ffffff", tline: LINE_L, area: "#f8fafc", card: "#ffffff", cline: LINE_L, bar: "#e2e8f0", b2: "#cbd5e1", title: "#cbd5e1", acc: "#93c5fd", frame: "#f8fafc" },
          dark:  { rail: "#0d1526", rline: LINE_D, ri: "#4b5b75", act: "rgba(96,165,250,0.16)", actc: "#93c5fd", top: "#0d1526", tline: LINE_D, area: "#0b1220", card: "#111a2c", cline: LINE_D, bar: "#1e2a40", b2: "#2c3b56", title: "#3b4a63", acc: "#2563eb", frame: "#0b1220" }
        };
        function theme(name, at, d = 0.45) {
          const t = TH[name], o = { duration: d, ease: "power2.inOut" };
          tl.to(qa("#s05-pv .t-rail"), { backgroundColor: t.rail, ...o }, at);
          tl.to(qa("#s05-pv .t-railline"), { backgroundColor: t.rline, ...o }, at);
          tl.to(qa("#s05-pv .ri .ic, #s05-pv .ri .tx, #s05-pv .logo-t"), { backgroundColor: t.ri, ...o }, at);
          tl.to(qa("#s05-pv .ri.is-act"), { backgroundColor: t.act, ...o }, at);
          tl.to(qa("#s05-pv .ri.is-act .ic, #s05-pv .ri.is-act .tx"), { backgroundColor: t.actc, ...o }, at);
          tl.to(qa("#s05-pv .t-top"), { backgroundColor: t.top, borderBottomColor: t.tline, ...o }, at);
          tl.to(qa("#s05-pv .t-area"), { backgroundColor: t.area, ...o }, at);
          tl.to(qa("#s05-pv .t-card"), { backgroundColor: t.card, borderColor: t.cline, ...o }, at);
          tl.to(qa("#s05-pv .bar:not(.b2)"), { backgroundColor: t.bar, ...o }, at);
          tl.to(qa("#s05-pv .bar.b2"), { backgroundColor: t.b2, ...o }, at);
          tl.to(qa("#s05-pv .trow"), { backgroundColor: t.cline, ...o }, at);
          tl.to(qa("#s05-pv .t-title, #s05-pv .t-av"), { backgroundColor: t.title, ...o }, at);
          tl.to(qa("#s05-pv .acc"), { backgroundColor: t.acc, ...o }, at);
          tl.to(q("#s05-pv"), { backgroundColor: t.frame, ...o }, at);
        }

        // option pills: selection overlay fades, label colour follows
        function pick(id, at, on) {
          const el = q(id);
          tl.to(el.querySelector(".sel"), { opacity: on ? 1 : 0, duration: 0.3, ease: "power2.out", overwrite: "auto" }, at);
          tl.to(el.querySelector(".lb"), { color: on ? "#1d4ed8" : "#475569", duration: 0.3, ease: "power2.out", overwrite: "auto" }, at);
        }

        // ── timing (all derived from T) ──
        const tDusk = T.themes + 0.3;
        const tDark = T.themes + 1.6;
        const tAuto = T.auto - 0.1;
        const tLang = T.langs - 0.15;
        const tAR = T.rtl - 0.1;

        // ── static initial states ──
        const cur = q("#s05-cursor"), rip = q("#s05-ripple");
        gsap.set(cur, { x: 1880, y: 640, opacity: 0 });
        gsap.set(rip, { opacity: 0 });
        gsap.set(q("#s05-hint"), { opacity: 0 });
        gsap.set(q("#s05-lang"), { opacity: 0 });
        gsap.set(qa("#s05-lang .opt"), { opacity: 0 });
        gsap.set(q("#s05-o-light .sel"), { opacity: 1 });
        gsap.set(q("#s05-o-light .lb"), { color: "#1d4ed8" });
        gsap.set(q("#s05-l-fr .sel"), { opacity: 1 });
        gsap.set(q("#s05-l-fr .lb"), { color: "#1d4ed8" });

        // ── 0. camera in; preview + appearance card arrive ──
        K.camIn(tl, q(".cam"), 0);
        tl.fromTo(q("#s05-pv"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: OUT }, 0.4);
        tl.fromTo(q("#s05-app"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: OUT }, 0.55);

        // ── 1. Mixed ──
        const cDusk = centre(q("#s05-o-dusk")), cDark = centre(q("#s05-o-dark")), cAuto = centre(q("#s05-o-auto"));
        tl.set(cur, { x: cDusk.x + 420, y: cDusk.y + 220 }, 0);
        tl.to(cur, { opacity: 1, duration: 0.25, ease: "none" }, tDusk - 0.85);
        K.cursorTo(tl, cur, cDusk.x + 60, cDusk.y + 12, tDusk - 0.85, 0.8);
        K.click(tl, cur, q("#s05-o-dusk"), tDusk, rip, cDusk.x, cDusk.y);
        pick("#s05-o-light", tDusk + 0.05, false); pick("#s05-o-dusk", tDusk + 0.05, true);
        theme("dusk", tDusk + 0.12);

        // title with the "dark" beat
        K.title(tl, q("#s05-title"), T.themes + 0.8);

        // ── 2. Night ──
        K.cursorTo(tl, cur, cDark.x + 60, cDark.y + 12, tDusk + 0.5, 0.7);
        K.click(tl, cur, q("#s05-o-dark"), tDark, rip, cDark.x, cDark.y);
        pick("#s05-o-dusk", tDark + 0.05, false); pick("#s05-o-dark", tDark + 0.05, true);
        theme("dark", tDark + 0.12, 0.5);

        // ── 3. Auto + hint ──
        K.cursorTo(tl, cur, cAuto.x + 60, cAuto.y + 12, tDark + 0.4, 0.65);
        K.click(tl, cur, q("#s05-o-auto"), tAuto, rip, cAuto.x, cAuto.y);
        pick("#s05-o-dark", tAuto + 0.05, false); pick("#s05-o-auto", tAuto + 0.05, true);
        tl.fromTo(q("#s05-hint"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.55, ease: OUT }, tAuto + 0.25);

        // ── 4. Language card rises ──
        tl.fromTo(q("#s05-lang"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: OUT }, tLang);
        tl.fromTo(qa("#s05-lang .opt"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: OUT, stagger: 0.06 }, tLang + 0.25);

        // ── 5. Arabic: the interface mirrors ──
        const cAR = centre(q("#s05-l-ar"));
        const dTravel = Math.max(0.5, Math.min(0.85, tAR - (tAuto + 0.6)));
        K.cursorTo(tl, cur, cAR.x + 24, cAR.y + 12, tAR - dTravel, dTravel);
        K.click(tl, cur, q("#s05-l-ar"), tAR, rip, cAR.x, cAR.y);
        pick("#s05-l-fr", tAR + 0.05, false); pick("#s05-l-ar", tAR + 0.05, true);
        const tM = tAR + 0.15;
        tl.to(q(".pv-rail"), { x: 760, duration: 0.7, ease: MOVE }, tM);
        tl.to(q(".pv-mainw"), { x: -180, duration: 0.7, ease: MOVE }, tM);
        tl.to(origs, { opacity: 0, duration: 0.4, ease: "power2.inOut" }, tM + 0.15);
        tl.to(mirs, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, tM + 0.15);
        tl.to(cur, { opacity: 0, duration: 0.35, ease: IN }, tAR + 1.0);

        // ── exit ──
        K.camOut(tl, q(".cam"), T.out);

        window.__timelines["s05"] = tl;
      </script>
    </template>
  </body>
</html>
