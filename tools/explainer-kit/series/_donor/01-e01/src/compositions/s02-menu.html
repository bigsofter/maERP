<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s02-root { position: absolute; inset: 0; overflow: hidden; }
        #s02-root .cam { position: absolute; inset: 0; }
        #s02-root .world { position: absolute; inset: 0; }
        #s02-root .col { position: absolute; top: 120px; width: 370px; }
        #s02-root .outline { position: absolute; inset: 0; border: 2px dashed rgba(148, 163, 184, 0.55); border-radius: 20px; box-sizing: border-box; }
        #s02-root .face { position: relative; box-sizing: border-box; background: var(--rail); border: 1px solid var(--rail-line); border-radius: 20px; box-shadow: var(--shadow-card); padding: 22px 18px 18px 22px; font-family: var(--f-body); }
        #s02-root .hd { display: flex; align-items: center; gap: 14px; height: 60px; margin-bottom: 14px; }
        #s02-root .sq { flex: none; width: 56px; height: 56px; border-radius: 14px; background: rgba(59, 130, 246, 0.15); display: flex; align-items: center; justify-content: center; }
        #s02-root .hi { width: 32px; height: 32px; display: block; fill: none; stroke: #fff; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
        #s02-root .hn { font-family: var(--f-display); font-weight: 600; font-size: 27px; letter-spacing: 0; text-transform: uppercase; color: #fff; white-space: nowrap; }
        #s02-root .gh { margin-top: 10px; height: 28px; line-height: 28px; font-size: 20px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--on-dark-3); }
        #s02-root .gh:first-child { margin-top: 0; }
        #s02-root .it { display: flex; align-items: center; gap: 14px; height: 40px; font-size: 26px; font-weight: 500; color: #e2e8f0; white-space: nowrap; }
        #s02-root .ii { flex: none; width: 24px; height: 24px; display: block; fill: none; stroke: var(--rail-icon); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

        #s02-root .admin { position: absolute; left: 1154px; top: 840px; width: 600px; height: 150px; box-sizing: border-box; background: var(--rail); border: 1px solid var(--rail-line); border-radius: 20px; box-shadow: var(--shadow-card); padding: 18px 22px; font-family: var(--f-body); }
        #s02-root .admin .hd { height: 44px; margin-bottom: 14px; }
        #s02-root .admin .sq { width: 44px; height: 44px; border-radius: 12px; }
        #s02-root .admin .hi { width: 26px; height: 26px; }
        #s02-root .admin .hn { font-size: 26px; flex: 1; }
        #s02-root .pin { width: 30px; height: 30px; display: block; overflow: visible; }
        #s02-root .chips { display: flex; gap: 10px; }
        #s02-root .chip { flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid var(--rail-line); background: rgba(148, 163, 184, 0.08); font-size: 26px; font-weight: 500; color: #e2e8f0; white-space: nowrap; }
      </style>

      <div id="s02-root" data-composition-id="s02" data-width="1920" data-height="1080">
        <div class="cam" id="s02-cam">
          <div class="world" id="s02-world">
<div class="col" id="s02-col0" style="left:166px">

  <div class="face" id="s02-face0">

<div class="gh">{{ui:web.group_travail}}</div>

<div class="it"><svg class="ii" data-ic="user" viewBox="0 0 24 24"></svg><span>{{ui:web.nav_clients}}</span></div>
<div class="it"><svg class="ii" data-ic="box" viewBox="0 0 24 24"></svg><span>{{ui:web.nav_conteneurs}}</span></div>
<div class="gh">{{ui:web.group_documents}}</div>
<div class="it"><svg class="ii" data-ic="doc" viewBox="0 0 24 24"></svg><span>{{ui:web.nav_cmr}}</span></div>
<div class="it"><svg class="ii" data-ic="cart" viewBox="0 0 24 24"></svg><span>{{ui:web.nav_bc}}</span></div>

</div>
<div class="col" id="s02-col1" style="left:572px">

    <div class="list">
<div class="gh">{{ui:web.group_machines}}</div>
<div class="it"><svg class="ii" data-ic="truck" viewBox="0 0 24 24"></svg><span>{{ui:web.nav_flotte}}</span></div>

<div class="col" id="s02-col2" style="left:978px">

  <div class="face" id="s02-face2">
    <div class="hd"><div class="sq"><svg class="hi" data-ic="coins" viewBox="0 0 24 24"></svg></div><div class="hn">{{ui:web.espace_finance}}</div></div>
    <div class="list">
<div class="gh">{{ui:web.group_ventes}}</div>
<div class="it"><svg class="ii" data-ic="doc" viewBox="0 0 24 24"></svg><span>{{ui:web.nav_factures}}</span></div>
<div class="gh">{{ui:web.group_achats_banque}}</div>
<div class="it"><svg class="ii" data-ic="cart" viewBox="0 0 24 24"></svg><span>{{ui:web.nav_achats}}</span></div>
<div class="it"><svg class="ii" data-ic="quote" viewBox="0 0 24 24"></svg><span>{{ui:web.nav_traites}}</span></div>
<div class="it"><svg class="ii" data-ic="bank" viewBox="0 0 24 24"></svg><span>{{ui:web.nav_banque}}</span></div>
<div class="it"><svg class="ii" data-ic="card" viewBox="0 0 24 24"></svg><span>{{ui:web.nav_paiements}}</span></div>
<div class="it"><svg class="ii" data-ic="trend" viewBox="0 0 24 24"></svg><span>{{ui:web.nav_previsions}}</span></div>
<div class="gh">{{ui:web.group_caisse}}</div>
<div class="it"><svg class="ii" data-ic="coins" viewBox="0 0 24 24"></svg><span>{{ui:web.nav_tresorerie}}</span></div>
<div class="gh">{{ui:web.group_pilotage}}</div>
<div class="it"><svg class="ii" data-ic="percent" viewBox="0 0 24 24"></svg><span>{{ui:web.nav_marges}}</span></div>
    </div>
  </div>
</div>
<div class="col" id="s02-col3" style="left:1384px">
  <div class="outline" id="s02-ol3"></div>
  <div class="face" id="s02-face3">
    <div class="hd"><div class="sq"><svg class="hi" data-ic="podium" viewBox="0 0 24 24"></svg></div><div class="hn">{{ui:web.espace_direction}}</div></div>
    <div class="list">
<div class="gh">{{ui:web.group_analytique}}</div>
<div class="it"><svg class="ii" data-ic="chart" viewBox="0 0 24 24"></svg><span>{{ui:web.nav_rapports}}</span></div>
<div class="it"><svg class="ii" data-ic="spark" viewBox="0 0 24 24"></svg><span>{{ui:web.nav_advisor}}</span></div>
<div class="it"><svg class="ii" data-ic="gauge" viewBox="0 0 24 24"></svg><span>{{ui:web.nav_direction}}</span></div>
    </div>
  </div>
</div>

            <div class="admin" id="s02-admin">
              <div class="hd"><div class="sq"><svg class="hi" data-ic="gear" viewBox="0 0 24 24"></svg></div><div class="hn">{{ui:web.group_admin}}</div>
                <svg class="pin" id="s02-pin" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z M12 14v7" fill="#FBBF24" stroke="#FBBF24" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
              </div>
              <div class="chips"><div class="chip">{{ui:web.nav_equipe}}</div><div class="chip">{{ui:web.nav_modules}}</div><div class="chip">{{ui:web.nav_parametres}}</div></div>
            </div>
          </div>
          <div class="k-title" id="s02-t1"><div class="k-title-bar"></div><div class="k-title-text">{{copy:s02.title}}</div></div>
        </div>
      </div>

      <script type="application/json" id="s02-sfx">[
        {"cue":"menu","off":-0.7,"type":"whoosh","gain":0.4},
        {"cue":"exploit","off":-1.3,"type":"whoosh","gain":0.3},
        {"cue":"exploit","off":-0.1,"type":"pop","gain":0.5},
        {"cue":"parc","off":-1.3,"type":"whoosh","gain":0.3},
        {"cue":"parc","off":-0.1,"type":"pop","gain":0.5},
        {"cue":"finance","off":-1.3,"type":"whoosh","gain":0.3},
        {"cue":"finance","off":-0.1,"type":"pop","gain":0.5},
        {"cue":"direction","off":-1.3,"type":"whoosh","gain":0.3},
        {"cue":"direction","off":-0.1,"type":"pop","gain":0.5},
        {"cue":"direction","off":2.0,"type":"whoosh","gain":0.3},
        {"cue":"direction","off":3.05,"type":"pop","gain":0.5},
        {"cue":"direction","off":3.5,"type":"stamp","gain":0.4}
      ]</script>

      <script>
        const T = {{T}};
        const $ = (s) => document.querySelector("#s02-root " + s);
        const $$ = (s) => document.querySelectorAll("#s02-root " + s);
        const IC = {
          compass: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
          truck: '<path d="M2 6h12v9H2z"/><path d="M14 9h4l3 3v3h-7"/><circle cx="6.5" cy="17" r="2"/><circle cx="17.5" cy="17" r="2"/>',
          coins: '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v4c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 10v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4"/><path d="M5 14v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4"/>',
          podium: '<path d="M3 20h18"/><rect x="3" y="13" width="5" height="7"/><rect x="9.5" y="5" width="5" height="15"/><rect x="16" y="9" width="5" height="11"/>',
          gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>',
          pulse: '<path d="M2 12h4l2.5-6 4 12 2.5-6H22"/>',
          desk: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
          route: '<circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7a3 3 0 000-6H9a3 3 0 010-6h7"/>',
          pin: '<path d="M12 21s7-6.2 7-11.5a7 7 0 10-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
          layers: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
          user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
          users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M17 14c2.8 0 4.5 2 4.5 5"/>',
          box: '<rect x="3" y="6" width="18" height="13" rx="1"/><path d="M8 6v13M12 6v13M16 6v13"/>',
          doc: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
          cart: '<path d="M4 4h2l2 11h10l2-8H7"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/>',
          quote: '<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 9h6M9 13h6"/>',
          fuel: '<path d="M5 21V4h9v17M3 21h13"/><path d="M14 9h3l2 2v7a1.5 1.5 0 01-3 0v-4"/><path d="M8 8h3"/>',
          wrench: '<path d="M14.5 6.5a4 4 0 005 5L20 14l-6 6a2.8 2.8 0 01-4-4l6-6z"/><path d="M15 3.5l-2 2 2 2"/>',
          bank: '<path d="M3 9l9-5 9 5z"/><path d="M5 11v7M10 11v7M14 11v7M19 11v7M3 20h18"/>',
          card: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',
          trend: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
          percent: '<path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.2"/><circle cx="17" cy="17" r="2.2"/>',
          chart: '<path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/>',
          spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',
          gauge: '<path d="M4 17a8 8 0 1116 0"/><path d="M12 17l4-5"/><circle cx="12" cy="17" r="1"/>'
        };
        $$("[data-ic]").forEach((s) => { s.innerHTML = IC[s.getAttribute("data-ic")] || ""; });

        const tl = gsap.timeline({ paused: true });
        K.camIn(tl, $("#s02-cam"), 0);
        K.splitWords($("#s02-t1 .k-title-text"));
        const world = $("#s02-world");
        gsap.set(world, { transformOrigin: "0 0" });

        // 2. the frame of the menu: four dashed outlines, left to right (first 0.35 s stays empty)
        const cue = [T.exploit, T.parc, T.finance, T.direction];
        for (let i = 0; i < 4; i++) {
          tl.fromTo($("#s02-ol" + i), { opacity: 0, y: 24 }, { opacity: 0.5, y: 0, duration: 0.7, ease: K.OUT }, 0.35 + i * 0.12);
          tl.set($("#s02-face" + i), { opacity: 0 }, 0);
        }
        K.title(tl, $("#s02-t1"), T.menu + 0.3);

        // camera frames: each card is centred while it is described (heights follow the CSS rows)
        const SC = [1.28, 1.4, 1.3, 1.4];
        const FR = [];
        for (let i = 0; i < 4; i++) {
          const face = $("#s02-face" + i);
          const nG = face.querySelectorAll(".gh").length, nI = face.querySelectorAll(".it").length;
          const h = 22 + 60 + 14 + nG * 28 + (nG - 1) * 10 + nI * 40 + 18;
          const cx = 166 + i * 406 + 185, s = SC[i];
          const top = i === 0 ? 62 : 455 - (h * s) / 2;
          FR.push({ x: 960 - cx * s, y: top - 120 * s, scale: s });
        }
        const HOME = { x: 0, y: 0, scale: 1 };
        let prev = HOME;
        for (let i = 0; i < 4; i++) {
          const at = i === 0 ? Math.max(T.exploit - 1.35, T.menu + 1.0) : cue[i] - 1.35;
          tl.fromTo(world, prev, { ...FR[i], duration: 1.2, ease: K.MOVE, immediateRender: false }, at);
          prev = FR[i];
        }

        // 3-5. each espace fills on its cue; the previous one dims as the camera leaves it
        for (let i = 0; i < 4; i++) {
          const at = cue[i] - 0.15;
          const face = $("#s02-face" + i);
          const hd = face.querySelector(".hd");
          const rows = face.querySelectorAll(".gh, .it");
          tl.to($("#s02-ol" + i), { opacity: 0, duration: 0.3, ease: "power2.out" }, at);
          tl.fromTo(face, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: K.OUT }, at);
          tl.fromTo(hd, { opacity: 0, scale: 0.7, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: K.OUT, immediateRender: false }, at + 0.05);
          tl.fromTo(rows, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.55, ease: K.OUT, stagger: 0.07, immediateRender: false }, at + 0.35);
          // a tall neighbour would sit under the lower-third once the camera is zoomed: it leaves fully and returns on the pull-back
          if (i > 0) tl.to($("#s02-col" + (i - 1)), (i - 1) % 2 === 0 ? { opacity: 0, filter: "blur(4px)", duration: 0.5, ease: "power2.out" } : { opacity: 0.55, filter: "blur(1.5px)", duration: 0.6, ease: "power2.out" }, cue[i] - 1.3);
        }

        // Exploitation is long: spotlight its three groups in turn while the narrator lists them
        {
          const kids = Array.from($("#s02-face0 .list").children);
          const groups = [];
          kids.forEach((el) => { if (el.classList.contains("gh")) groups.push([el]); else groups[groups.length - 1].push(el); });
          const t0 = T.exploit + 2.1, t1 = T.parc - 1.5, step = (t1 - t0) / groups.length;
          groups.forEach((g, k) => {
            const others = kids.filter((el) => !g.includes(el));
            tl.to(others, { opacity: 0.4, duration: 0.45, ease: "power2.out" }, t0 + k * step);
            tl.to(g, { opacity: 1, duration: 0.45, ease: "power2.out" }, t0 + k * step);
          });
          tl.to(kids, { opacity: 1, duration: 0.4, ease: "power2.out" }, t1);
        }

        // 6. title leaves, camera pulls back to show all four, they return to full, Admin is pinned at the bottom
        K.titleOut(tl, $("#s02-t1"), T.direction + 2.0);
        tl.fromTo(world, FR[3], { ...HOME, duration: 1.1, ease: K.MOVE, immediateRender: false }, T.direction + 2.0);
        tl.to([$("#s02-col0"), $("#s02-col1"), $("#s02-col2")], { opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power2.out" }, T.direction + 2.45);
        tl.set($("#s02-admin"), { opacity: 0 }, 0);
        tl.set($("#s02-pin"), { opacity: 0 }, 0);
        tl.fromTo($("#s02-admin"), { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.7, ease: K.OUT }, T.direction + 3.1);
        tl.fromTo($("#s02-pin"), { opacity: 0, scale: 1.7, rotation: -28, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, rotation: 0, duration: 0.3, ease: K.OUT }, T.direction + 3.5);

        K.camOut(tl, $("#s02-cam"), T.out);
        window.__timelines["s02"] = tl;
      </script>
    </template>
  </body>
</html>
